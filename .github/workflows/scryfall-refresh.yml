name: cmd_and_ctrl Scryfall refresh

permissions:
  contents: read

on:
  schedule:
    # Sundays at 05:00 UTC. Matches the cadence in the comment at the
    # top of scripts/scryfall-refresh.sh; chosen to avoid colliding
    # with the nightly Playwright run (08:30 UTC) and Scryfall's
    # own bulk refresh (typically rolls daily ~03:00 UTC, so we read
    # a fresh snapshot two hours after they publish).
    - cron: "0 5 * * 0"
  workflow_dispatch:

concurrency:
  # One refresh at a time. cancel-in-progress would interrupt a
  # mid-stream rsync of a ~400 MB JSON dump and leave a half-written
  # tmp file; let the running job finish.
  group: cmdctrl-scryfall
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: self-hosted
    env:
      CMDCTRL_HOST: ${{ vars.CMDCTRL_HOST }}
      # Must match CMDCTRL_DATA_DIR in the systemd unit's
      # EnvironmentFile (/etc/cmd_and_ctrl/env on the deploy host).
      # Otherwise the script writes the dump where the server isn't
      # looking and the lobby keeps reporting "card index not loaded".
      CMDCTRL_DATA_DIR: /var/lib/cmd_and_ctrl/data
      # SSH_OPTS is NOT declared here: the pin step exports it through
      # $GITHUB_ENV, which a job-level value would override (#1739).
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify CMDCTRL_HOST is set
        run: |
          if [ -z "${CMDCTRL_HOST}" ]; then
            echo "::error::Repo variable CMDCTRL_HOST is not set."
            exit 1
          fi

      # SSH trust is pinned by a repo variable, not by each runner's own
      # known_hosts (#1739); the script says why.
      - name: Pin the deploy host's SSH key
        env:
          HOST_KEY: ${{ vars.CMDCTRL_HOST_KEY }}
        run: scripts/pin-host-key.sh "${CMDCTRL_HOST}" CMDCTRL_HOST_KEY

      - name: Run scryfall-refresh on deploy host
        # sudo -u cmdctrl so the dump is created with the same
        # ownership as the service user, avoiding a permission flip
        # where krkn-owned files are unreadable by the service.
        # Requires this sudoers stanza on the host:
        #   krkn ALL=(cmdctrl) NOPASSWD:SETENV: /opt/cmd_and_ctrl/scripts/scryfall-refresh.sh
        # SETENV is needed so CMDCTRL_DATA_DIR survives the sudo
        # privilege boundary.
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo -u cmdctrl CMDCTRL_DATA_DIR=${CMDCTRL_DATA_DIR} /opt/cmd_and_ctrl/scripts/scryfall-refresh.sh"

      - name: Restart cmd-and-ctrl to reload the card index
        # The server loads the index once at boot, so a fresh dump on
        # disk has no effect until the process re-reads it. Restart is
        # cheap (~1s) and recovers from the "card index not loaded"
        # state players will hit if the server started before the
        # first refresh ever ran.
        #
        # reset-failed first, as in ci-cd.yml's "Restart game server
        # service": a unit that hit its StartLimitBurst refuses a restart
        # until the interval has passed (#598 item 2).
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} 'sudo systemctl reset-failed cmd-and-ctrl 2>/dev/null || true; sudo systemctl restart cmd-and-ctrl'

      - name: Confirm service came back up
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            'systemctl is-active cmd-and-ctrl && systemctl status cmd-and-ctrl --no-pager --lines=5'
