name: cmd_and_ctrl E2E (nightly)

permissions:
  contents: read

on:
  schedule:
    # 08:30 UTC = 01:30 PT / 04:30 ET — quiet window, avoids colliding
    # with the hourly Scryfall mirror refresh and most push traffic.
    - cron: "30 8 * * *"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: self-hosted
    env:
      CMDCTRL_DATA_DIR: ${{ github.workspace }}/data
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests-e2e/package-lock.json

      - name: Refresh Scryfall bulk data
        run: scripts/scryfall-refresh.sh

      - name: Client — npm ci
        working-directory: client
        run: npm ci

      - name: Tests — npm ci
        working-directory: tests-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests-e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests-e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 14
