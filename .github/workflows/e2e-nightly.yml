name: cmd_and_ctrl E2E

permissions:
  contents: read

on:
  # Deliberately NOT run on push to main. The suite takes ~12 minutes
  # and there are two self-hosted runners shared with ci-cd.yml, so a
  # merge train queued the 5-8 minute CI jobs behind it. It was also
  # largely theatre: cancel-in-progress below meant most per-merge runs
  # were cancelled within seconds by the next merge (6 of 10 on
  # 2026-09-11), so only the train's final merge ever completed.
  #
  # Trade-off accepted knowingly: a regression now sits until the
  # nightly run rather than surfacing within ~15 minutes. Run it on
  # demand against any branch with workflow_dispatch:
  #   gh workflow run "cmd_and_ctrl E2E" --ref <branch>
  schedule:
    # 08:30 UTC = 01:30 PT / 04:30 ET — quiet window, avoids colliding
    # with the hourly Scryfall mirror refresh and most push traffic.
    - cron: "30 8 * * *"
  # The inputs are the bot-soak job's knobs (#685), and every one of
  # them has a default that is what the schedule uses, so a hand run
  # with nothing filled in is the nightly. They exist for the two things
  # a hand run is for: shrinking the job while checking the wiring
  # (soak_games: 2), and replaying a night that went red
  # (soak_seed: <the seed the artifact printed>).
  #
  # `inputs` is empty on a schedule, so every consumer below reads
  # `inputs.x || '<default>'` rather than trusting the default here.
  workflow_dispatch:
    inputs:
      heuristic_games:
        description: "Four-heuristic games to a winner (S31 exit criterion 2)"
        required: false
        default: "20"
      soak_games:
        description: "Randomised soak games (S31 exit criterion 4)"
        required: false
        default: "100"
      soak_policy:
        description: "What fills the soak's seats: random | heuristic | mixed"
        required: false
        default: "random"
      soak_seed:
        description: "Soak base seed. Empty = derived from today's UTC date"
        required: false
        default: ""
      stall:
        description: "AISEAT_STALL — no-sequence-movement budget per game"
        required: false
        default: "30s"
      wallclock:
        description: "AISEAT_WALLCLOCK — wall-clock backstop per game"
        required: false
        default: "300s"

# One e2e run per ref; a newer merge supersedes an in-flight run.
# Safe to cancel (unlike ci-cd.yml's deploy) — nothing here mutates
# the prod host, and the newest commit is the signal we care about
# on the single self-hosted runner.
concurrency:
  group: cmdctrl-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole-game bot tests, which ci-cd.yml skips.
  #
  # They play complete four-seat games to a winner — the random
  # fuzzer, the heuristic head-to-head, the Layer A absorption census,
  # the model funnel's outage drill — and between them they caught
  # four engine bugs on 2026-09-11 that no unit test was looking for.
  # They are also most of internal/aiseat's runtime, and under -race on
  # a contended runner that package crossed Go's 600s per-package
  # default and failed main plus every open PR.
  #
  # So they are gated behind AISEAT_GAME_TESTS and run here instead.
  # This job is the whole justification for that gate: skipping them in
  # PR CI is a deliberate trade (a bug they would catch surfaces the
  # next morning, not in the PR that caused it) and it is only an
  # acceptable trade while this job actually runs them. If this job is
  # ever removed or left red, the gate has quietly deleted the tests.
  #
  # -race on purpose: these are the only tests that exercise the runner
  # goroutine against a live room, so they are where a concurrency bug
  # in the bot seat would actually show up.
  bot-games:
    runs-on: self-hosted
    env:
      AISEAT_GAME_TESTS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # cache: false for the same reason as the job below — $HOME
      # persists on a self-hosted runner and actions/cache untarring
      # over Go's read-only module cache fails on every run.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Bot whole-game tests
        working-directory: server
        # -skip the twenty-game random run and, since #685, the
        # twenty-game heuristic run: the step below owns the first and
        # the `bot-soak` job owns the second, and neither should be
        # played twice a night.
        #
        # Splitting the random one out costs a second `go test`
        # invocation and buys the difference between 24 minutes and 4:
        # one four-bot random game is ~8s, and ~70s under -race. Twenty
        # of them do not fit in this step's budget, and buying the race
        # detector for them is the wrong thing to spend it on — the
        # runner-goroutine concurrency it would be watching is the same
        # code path every other whole-game test in this step drives
        # under -race, on the same rooms, with the same observers. The
        # fuzzing value of twenty random tables is in the ENGINE states
        # they reach, and the detector adds nothing to that. The
        # heuristic twenty are skipped on exactly that argument.
        #
        # Measured 2026-09-14, this step with the -skip in place:
        # internal/aiseat 336s under -race on a contended machine.
        run: go test ./internal/aiseat/... -race -timeout 30m -skip 'TestFourRandomBotsPlayToAWinner|TestFourHeuristicBotsPlayToAWinner'

      # S31's four-`random`-bots exit criterion: twenty consecutive
      # unattended games to a winner, no deadlocks, no illegal actions,
      # replays captured. Twenty is the sprint's number and it lives
      # here rather than in a default so the line stays continuously
      # true instead of being true on the afternoon somebody typed it.
      #
      # AISEAT_REPLAY_DIR puts the ws.Room replay JSONL somewhere the
      # upload step can reach. The test deletes a passing game's replay
      # immediately — one game is ~390 MiB — so this directory is empty
      # unless something went wrong, which is why the upload is
      # if: failure() with if-no-files-found: ignore.
      - name: Bot random-table soak (20 games, replays captured)
        working-directory: server
        env:
          AISEAT_RANDOM_GAMES: "20"
          AISEAT_REPLAY_DIR: ${{ github.workspace }}/bot-replays
        run: go test ./internal/aiseat/ -run TestFourRandomBotsPlayToAWinner -v -timeout 30m

      # The catalog soak (#601) needs the Scryfall dump: a registered
      # Spec carries an oracle ID and a name, not a type line or a
      # mana cost, so without the dump there is no card to deal and
      # the test skips. Same cache key as the playwright job below --
      # both jobs run on the same day's dump, and whichever starts
      # first populates it.
      - name: Compute Scryfall cache key
        id: scryfall-stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Scryfall bulk data
        uses: actions/cache@v4
        with:
          path: data/scryfall
          key: scryfall-default-cards-${{ steps.scryfall-stamp.outputs.date }}
          restore-keys: |
            scryfall-default-cards-

      - name: Refresh Scryfall bulk data
        run: scripts/scryfall-refresh.sh

      # Random decks dealt out of the catalog itself, played to a
      # winner. Fails on any EventEffectError -- a card whose effect
      # threw mid-resolution, which the engine logs and survives, so
      # no other test in the tree goes red over it.
      #
      # No -race: this is about the cards the games REACH, and the
      # runner-goroutine concurrency the detector would watch is the
      # same code every whole-game test above already drives under it.
      - name: Catalog soak (decks dealt from the catalog)
        working-directory: server
        env:
          AISEAT_GAME_TESTS: "1"
          AISEAT_CATALOG_GAMES: "2"
          CMDCTRL_SCRYFALL_DUMP: ${{ github.workspace }}/data/scryfall/default-cards.json
          AISEAT_CATALOG_REPORT: ${{ github.workspace }}/catalog-report/per-card.json
        run: go test ./internal/aiseat/ -run TestCatalogSoak -v -timeout 30m

      # Uploaded on success too: the useful half of this report is the
      # cards nothing reached, which is a list you want on a green run.
      - name: Upload catalog report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: catalog-report
          path: catalog-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bot replays
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: bot-replays
          path: bot-replays/
          if-no-files-found: ignore
          retention-days: 14

  # S31's two standing gates that nothing ran (#685, #89 exit criteria
  # 2 and 4 of the ORIGINAL list — see docs/sprints.md § S31):
  #
  #   2. four `heuristic` bots to a winner within 50 turns, 20 runs
  #   4. a 100-game randomised run with zero engine-rejected actions
  #
  # Both numbers were true on the afternoon somebody typed them into
  # the sprint doc and never again: the nightly played the heuristic
  # test's default 3 seeds, and no workflow has ever set
  # AISEAT_SOAK_GAMES, so `TestRandomBotSoak` had run in CI exactly
  # zero times. A criterion nothing runs is a claim, not a gate.
  #
  # Its own job rather than two more steps on `bot-games`: that job is
  # already ~10 minutes of whole games under -race plus the catalog
  # soak's Scryfall download, this adds ~15, and one red step there
  # would hide the other three. Separate jobs also mean this one can
  # own its budgets (below) without loosening anything `bot-games`
  # asserts.
  #
  # NO -race, deliberately, for the reason the random-table step
  # already records: what these two buy is the ENGINE states 120 four-
  # bot tables reach, and the runner-goroutine concurrency the detector
  # would watch is the same code every whole-game test in `bot-games`
  # drives under -race. -race also costs roughly 8x here (one random
  # game is ~8s, ~70s under it), which turns a 15-minute job into two
  # hours on a runner shared with CI.
  #
  # NOTHING here needs the network or a model key. The improviser and
  # the model tiers are out of scope by construction: the seats are
  # filled by `heuristic.New()` and `aiseat.NewRandomPolicy`, both of
  # which decide in microseconds against the local engine.
  bot-soak:
    runs-on: self-hosted
    # Measured 2026-09-19 on an idle 24-core developer machine: the
    # heuristic gate 112s for 20 games, the soak 679s for 100. 100
    # minutes is ~8x that, and it is deliberately ABOVE the two
    # `go test -timeout` values below (30m + 60m): a Go timeout prints
    # every goroutine's stack into the artifact, a job timeout kills
    # the upload.
    timeout-minutes: 100
    env:
      AISEAT_GAME_TESTS: "1"
      # The budgets, and the whole reason #685 asked for them before
      # the steps: every bot-table test used to carry literals tuned on
      # an idle machine, and on the shared self-hosted runner those
      # literals failed three PRs that had touched nothing near the bot
      # seat (#418, #431, #434) and then the nightly itself (#600).
      # A loaded runner should make this job slow, not red.
      #
      # 30s without the room's sequence moving is a deadlocked table by
      # any reading — the soak's own default is 3s — and 300s of wall
      # clock per game is ~40x the ~8s a game actually takes.
      AISEAT_STALL: ${{ inputs.stall || '30s' }}
      AISEAT_WALLCLOCK: ${{ inputs.wallclock || '300s' }}
      SOAK_LOGS: ${{ github.workspace }}/bot-soak-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # cache: false for the same reason as every other job here: $HOME
      # persists on a self-hosted runner and actions/cache untarring
      # over Go's read-only module cache fails on every run.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      # Verbatim from ci-cd.yml (#942, #892). This job is a second
      # ~15-minute `go test` on the same shared runner whose disk
      # filled mid-test three branches in a row on 2026-09-18, and a
      # soak that dies on ENOSPC files a bug about the engine.
      - name: Free runner disk
        shell: bash
        run: |
          df -h / /tmp | sed 's/^/before: /'
          rm -rf /tmp/go-build* 2>/dev/null || true
          avail_kb=$(df --output=avail -k / | tail -1 | tr -d ' ')
          if [ "${avail_kb:-0}" -lt 15728640 ]; then
            echo "under 15 GB free: dropping the Go build and test caches"
            go clean -cache -testcache
          fi
          if command -v docker >/dev/null 2>&1; then
            docker system prune -f >/dev/null 2>&1 || true
          fi
          df -h / /tmp | sed 's/^/after: /'

      # Every game in this job is seeded, and every seed is printed, so
      # a failure is replayable from the artifact alone.
      #
      # The heuristic gate's seeds are fixed in the test (101..120), so
      # it plays the same twenty tables every night and a regression
      # there is unambiguous. The soak's base seed is derived from the
      # UTC date instead, the way the catalog soak's is (#601): a fixed
      # soak seed would fuzz the same hundred tables for ever and stop
      # finding anything after the first green night. The x1000 is what
      # keeps consecutive nights disjoint — game i uses base+i, so two
      # nights 1 apart would otherwise overlap in 99 of 100 games.
      - name: Pick the soak's base seed
        id: seed
        shell: bash
        run: |
          set -eu
          seed="${SEED_INPUT}"
          if [ -z "${seed}" ]; then
            seed="$(date -u +%Y%m%d)000"
          fi
          echo "seed=${seed}" >> "$GITHUB_OUTPUT"
          echo "soak base seed: ${seed} (games use base+0 .. base+n-1)"
        env:
          SEED_INPUT: ${{ inputs.soak_seed }}

      # S31 exit criterion 2. 20/20 to a single survivor inside 50
      # turns, zero engine-refused moves, zero runner fallbacks — the
      # heuristic policy is the fallback, so needing one is a bug.
      #
      # tee, not just the step log: the artifact is the thing a failure
      # is read out of the next morning, and `-v` puts the per-seed
      # line (state, turns, winner, lives, applied/passes/rejected) in
      # it for green games too, which is what makes a red one
      # comparable.
      - name: Heuristic gate — four heuristic bots to a winner, 20 games
        working-directory: server
        env:
          AISEAT_HEURISTIC_GAMES: ${{ inputs.heuristic_games || '20' }}
        run: |
          set -euo pipefail
          mkdir -p "${SOAK_LOGS}"
          go test ./internal/aiseat/ -run TestFourHeuristicBotsPlayToAWinner \
            -v -timeout 30m 2>&1 | tee "${SOAK_LOGS}/heuristic-games.log"

      # S31 exit criterion 4. The two gates are independent, so a red
      # heuristic run must not hide the soak: !cancelled() runs this
      # whatever the step above did, and both report.
      #
      # A stall fails the game with the board printed (turn, step,
      # priority holder, pending choices, every seat) and the exact
      # command to replay that one table. That dump lands in the
      # artifact through the same tee.
      - name: Random soak — 100 games, zero engine-rejected actions
        if: ${{ !cancelled() }}
        working-directory: server
        env:
          AISEAT_SOAK_GAMES: ${{ inputs.soak_games || '100' }}
          AISEAT_SOAK_POLICY: ${{ inputs.soak_policy || 'random' }}
          AISEAT_SOAK_SEED: ${{ steps.seed.outputs.seed }}
        run: |
          set -euo pipefail
          mkdir -p "${SOAK_LOGS}"
          go test ./internal/aiseat/ -run TestRandomBotSoak \
            -v -timeout 60m 2>&1 | tee "${SOAK_LOGS}/random-soak.log"

      # Uploaded on green too, and that is the point: the log carries
      # the seeds and the per-game result line, so the night a game
      # goes red you can diff it against the night before.
      #
      # These are the decision LOGS of the run, not AISEAT_DECISION_LOG.
      # That variable writes every policy window with its full board
      # view — 100-250 MiB per game, so 120 games is 12-30 GB — and this
      # job shares a disk with CI (#892). If a position corpus is ever
      # wanted from the nightly it needs its own job, its own retention
      # and `AISEAT_DECISION_LOG_MODE=escalated`.
      - name: Upload soak decision logs and stall dumps
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bot-soak-logs
          path: bot-soak-logs/
          if-no-files-found: warn
          retention-days: 14

  # One standing issue, not one per night.
  #
  # A nightly that files a fresh issue every morning trains everyone to
  # close them unread, and a nightly that files nothing is a gate
  # nobody is told about. So: find the open issue with this exact
  # title and comment on it, or open it if there is none. Closing it is
  # how you say "handled"; the next red night opens a fresh one.
  #
  # Scheduled runs only. A workflow_dispatch against a branch is
  # somebody checking their own work and is expected to go red.
  soak-tracker:
    needs: [bot-soak]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      # curl is the house style for talking to the API from a workflow
      # (see issue-triage.yml, which explains why: no gh, no
      # actions/github-script, self-hosted runners). That file also says
      # "no jq", because its writes are idempotent and need no
      # read-modify-write. This one does need one — "comment if it
      # exists, else create" — and jq is already a hard dependency of
      # this workflow through scripts/scryfall-refresh.sh.
      - name: Open or update the standing soak-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          TITLE: "Nightly bot soak is red (S31 standing gates)"
        run: |
          set -euo pipefail

          api() {
            curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # Exact title match over the label pair, not the search API:
          # search is a separate, eventually-consistent index, and a
          # stale answer here means a duplicate issue.
          existing=$(api "${API}/issues?state=open&labels=bug,tech-debt&per_page=100" \
            | jq -r --arg t "${TITLE}" '[.[] | select(.title == $t)] | .[0].number // empty')

          # printf rather than a heredoc: a heredoc inside a YAML block
          # scalar keeps the block's indentation, and four indented
          # lines are a Markdown code fence nobody meant to write.
          body=$(printf '%s\n' \
            'The nightly `bot-soak` job failed: the heuristic-20 gate, the' \
            '100-game randomised soak, or both. These are S31 exit criteria' \
            '2 and 4 (docs/sprints.md § S31), and they are gates rather than' \
            'claims only while this job is green.' \
            '' \
            "- Run: ${RUN_URL}" \
            "- Commit: \`${SHA}\`" \
            '' \
            'The `bot-soak-logs` artifact on that run holds both `go test -v`' \
            'logs. Every game is seeded and every seed is printed, including' \
            'on a green night, and a stalled table prints the exact command' \
            'that replays it.' \
            '' \
            'This is one standing issue rather than one per night: a later' \
            'red night comments here instead of filing again. Close it once' \
            'the nightly is green, and the next failure opens a fresh one.')

          if [ -n "${existing}" ]; then
            payload=$(jq -n --arg b "${body}" '{body: $b}')
            code=$(api -o /dev/null -w '%{http_code}' -X POST -d "${payload}" \
              "${API}/issues/${existing}/comments")
            case "${code}" in
              201) echo "commented on #${existing}" ;;
              *) echo "::error::commenting on #${existing} failed with HTTP ${code}"; exit 1 ;;
            esac
          else
            payload=$(jq -n --arg t "${TITLE}" --arg b "${body}" \
              '{title: $t, body: $b, labels: ["bug", "tech-debt"]}')
            code=$(api -o /dev/null -w '%{http_code}' -X POST -d "${payload}" "${API}/issues")
            case "${code}" in
              201) echo "opened the standing soak-failure issue" ;;
              *) echo "::error::opening the soak-failure issue failed with HTTP ${code}"; exit 1 ;;
            esac
          fi

  playwright:
    runs-on: self-hosted
    env:
      CMDCTRL_DATA_DIR: ${{ github.workspace }}/data
      CI: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # cache: false on purpose. These are self-hosted runners, so
      # $HOME survives between jobs and ~/go/pkg/mod is already warm --
      # there is nothing for a cache to restore that is not already
      # there. Worse, Go marks the module cache read-only (files 0444,
      # dirs 0555), so actions/cache untarring over it fails with
      #   /usr/bin/tar: .../openpgp/errors: Cannot mkdir: No such file
      #   ##[warning]Failed to restore: "/usr/bin/tar" ... exit code 2
      # on every run, then silently re-downloads the whole module set.
      # Note the Scryfall cache below is NOT affected and stays on: its
      # path is inside the workspace, not $HOME.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      # No `cache:` input, for the same reason as Go above -- ~/.npm
      # persists on a self-hosted runner and restoring over it fails the
      # same way. Note setup-node's `cache` is an enum of package
      # managers (npm/yarn/pnpm), NOT a boolean: `cache: false` is a
      # hard error ("Caching for 'false' is not supported"). Omitting
      # the input is how you turn it off.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # The Scryfall default-cards dump is ~400-500 MB; cache it keyed
      # by day so push-triggered runs after the nightly refresh skip
      # the download entirely (scryfall-refresh.sh skips when its
      # last-refresh stamp is <24h old). restore-keys falls back to an
      # older day's cache, which the script then refreshes in place.
      - name: Compute Scryfall cache key
        id: scryfall-stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Scryfall bulk data
        uses: actions/cache@v4
        with:
          path: data/scryfall
          key: scryfall-default-cards-${{ steps.scryfall-stamp.outputs.date }}
          restore-keys: |
            scryfall-default-cards-

      - name: Refresh Scryfall bulk data
        run: scripts/scryfall-refresh.sh

      # The pre-built decks are only HALF checked without real Scryfall
      # data: decks_test.go pins coverage, count, singleton and the
      # DECLARED colour identities offline, but it cannot tell a
      # plausible card name from a real one, and it never runs
      # deck.Validate. realdump_manual_test.go does both, and until now
      # nothing ran it — CMDCTRL_SCRYFALL_DUMP is set in no workflow,
      # so the check existed and had never executed.
      #
      # It belongs here because this is the only job that has the dump.
      # It matters more now than when it was added: these decks are
      # served to the Add-bot picker AND to the human deck picker, so a
      # renamed card is a 422 in a player's face at the moment they try
      # to start a game, not a test failure. The package moved to
      # internal/decks when the second picker landed.
      - name: Pre-built decks — validate against the real Scryfall dump
        working-directory: server
        env:
          CMDCTRL_SCRYFALL_DUMP: ${{ github.workspace }}/data/scryfall/default-cards.json
        run: go test ./internal/decks/ -run RealDump -v

      - name: Client — npm ci
        working-directory: client
        run: npm ci

      - name: Tests — npm ci
        working-directory: tests-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests-e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: tests-e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests-e2e/playwright-report/
          retention-days: 5
