name: cmd_and_ctrl CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: cmdctrl-cd-${{ github.ref }}
  # Cancel superseded runs on PRs/topic branches so the single
  # self-hosted runner doesn't queue stale builds. Keep both deploy
  # branches serialized (never cancel) so an in-flight deploy can't be
  # aborted mid-rsync -- that would leave a host with a new binary and
  # a half-written client bundle.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  cmdctrl-ci:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests-e2e/package-lock.json

      - name: Server — gofmt check
        working-directory: server
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Server — vet
        working-directory: server
        run: go vet ./...

      - name: Server — test
        working-directory: server
        run: go test -race -cover ./...

      - name: Server — build
        working-directory: server
        run: |
          mkdir -p bin
          go build -o bin/cmd_and_ctrl-server ./cmd/server

      - name: Bot — build
        working-directory: server
        run: go build -o bin/cmd_and_ctrl-bot ./cmd/bot

      - name: Client — npm ci
        working-directory: client
        run: npm ci

      - name: Client — typecheck
        working-directory: client
        run: npm run check

      - name: Client — unit tests
        working-directory: client
        run: npm test

      - name: Client — lint
        working-directory: client
        run: npm run lint

      # `npm run build` is `svelte-check && vite build`; the typecheck
      # step above already ran svelte-check, so invoke vite directly to
      # avoid running it twice. Local `npm run build` is unchanged.
      - name: Client — build
        working-directory: client
        run: npx vite build

      - name: Tests-e2e — npm ci
        working-directory: tests-e2e
        run: npm ci

      - name: Tests-e2e — typecheck
        working-directory: tests-e2e
        run: npx tsc --noEmit

      - name: Upload server binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-server-bin
          path: server/bin/cmd_and_ctrl-server
          retention-days: 7

      - name: Upload bot binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-bot-bin
          path: server/bin/cmd_and_ctrl-bot
          retention-days: 7

      - name: Upload client dist
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-client-dist
          path: client/dist/
          retention-days: 7

  cmdctrl-cd:
    runs-on: self-hosted
    needs: cmdctrl-ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    env:
      # main deploys production, develop deploys the preview box. Distinct
      # variable names rather than deployment environments on purpose: an
      # environment variable that someone forgets to define silently falls
      # back to the repo-level value, which here would mean deploying the
      # develop branch onto production. An unset CMDCTRL_DEV_HOST instead
      # fails the guard step below.
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      CMDCTRL_HOST: >-
        ${{ github.ref == 'refs/heads/main' && vars.CMDCTRL_HOST || vars.CMDCTRL_DEV_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify the deploy target is set
        run: |
          if [ -z "${CMDCTRL_HOST}" ]; then
            if [ "${DEPLOY_ENV}" = "prod" ]; then
              echo "::error::Repo variable CMDCTRL_HOST is not set. Configure under Settings → Secrets and variables → Actions → Variables."
            else
              echo "::error::Repo variable CMDCTRL_DEV_HOST is not set, so the develop branch has nowhere to deploy. Configure under Settings → Secrets and variables → Actions → Variables."
            fi
            exit 1
          fi
          echo "Deploy target: krkn@${CMDCTRL_HOST} (${DEPLOY_ENV})"

      - name: Download server binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-server-bin
          path: server/bin

      - name: Download bot binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-bot-bin
          path: server/bin

      - name: Download client dist
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-client-dist
          path: client/dist

      - name: Restore server binary exec bit
        run: chmod +x server/bin/cmd_and_ctrl-server server/bin/cmd_and_ctrl-bot

      - name: Deploy server binary
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-server \
            krkn@${CMDCTRL_HOST}:/opt/cmd_and_ctrl/server/bin/

      - name: Deploy bot binary
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-bot \
            krkn@${CMDCTRL_HOST}:/opt/cmd_and_ctrl/bot/bin/ || {
              echo "::warning::Bot deploy skipped — /opt/cmd_and_ctrl/bot/bin/ may not exist yet. Create it on the host before the bot rolls out."
            }

      - name: Deploy client dist
        run: |
          rsync -a --delete -e "ssh ${SSH_OPTS}" \
            client/dist/ \
            krkn@${CMDCTRL_HOST}:/var/www/cmdctrl-client/

      - name: Deploy scripts
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            scripts/ \
            krkn@${CMDCTRL_HOST}:/opt/cmd_and_ctrl/scripts/
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} 'chmod +x /opt/cmd_and_ctrl/scripts/*.sh'

      # Caddy's config ships from this repo because its @api matcher mirrors
      # the server's route table (see deploy/Caddyfile). The HomeLab cloud-init
      # template only writes a first-boot placeholder and cannot update a
      # running host -- that VM carries lifecycle ignore_changes on its
      # cloud-init -- so this step is the only thing that maintains it.
      #
      # Validated before installation, and Caddy is reloaded only when the
      # content actually changed, so repeat deploys do not bounce the proxy.
      # A syntactically broken Caddyfile fails the deploy instead of taking
      # the site down. The previous file is kept as a timestamped backup.
      - name: Deploy Caddy config
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" deploy/Caddyfile \
            krkn@${CMDCTRL_HOST}:/tmp/Caddyfile.new
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            set -eu
            caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
            if sudo cmp -s /tmp/Caddyfile.new /etc/caddy/Caddyfile; then
              echo "Caddyfile already current; not reloading."
            else
              sudo cp -a /etc/caddy/Caddyfile \
                "/etc/caddy/Caddyfile.bak.$(date +%Y%m%d-%H%M%S)"
              sudo install -o root -g root -m 0644 /tmp/Caddyfile.new /etc/caddy/Caddyfile
              sudo systemctl reload caddy
              echo "Caddyfile updated; Caddy reloaded."
            fi
            rm -f /tmp/Caddyfile.new
          '

      # Provision the bug-report token (ADR 0017) into the server's
      # env file (/etc/cmd_and_ctrl/env — written by the HomeLab
      # cloud-init template, read by the systemd units) so nobody has
      # to touch the host by hand. Source of truth is the
      # CMDCTRL_GITHUB_TOKEN Actions secret; rotation = update the
      # secret, rerun the deploy. The value travels over stdin (never
      # ssh argv) so it can't surface in `ps` on the host; Actions
      # masks it in logs. Runs after "Deploy scripts" (which lands
      # set-server-env.sh) and before the restart that picks it up.
      # Skips cleanly when the secret isn't configured — bug
      # reporting simply stays disabled, same as an unset var. sudo
      # because the env file is root:cmdctrl; krkn's cloud-init
      # sudoers grant covers it (same as the restart steps).
      - name: Sync server env (bug-report token)
        env:
          BUGREPORT_TOKEN: ${{ secrets.CMDCTRL_GITHUB_TOKEN }}
        run: |
          if [ -z "${BUGREPORT_TOKEN}" ]; then
            echo "CMDCTRL_GITHUB_TOKEN secret not set; skipping (bug reporting stays disabled)."
            exit 0
          fi
          printf '%s' "${BUGREPORT_TOKEN}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            'sudo /opt/cmd_and_ctrl/scripts/set-server-env.sh CMDCTRL_GITHUB_TOKEN'

      # Bug-report screenshots need a PUBLIC origin: a GitHub issue can
      # only render an image its proxy can fetch, so the server has to
      # know the URL it is reachable at from the outside. Not a secret —
      # a repo variable, defaulting to the production hostname — but
      # provisioned the same way so the env file stays the single source
      # of truth on the host. Unset leaves attachments off and text
      # reports working (see ADR 0017 §6).
      - name: Sync server env (public base URL)
        env:
          PUBLIC_BASE_URL: >-
            ${{ github.ref == 'refs/heads/main'
                && (vars.CMDCTRL_PUBLIC_BASE_URL || 'https://cmd.labxp.io')
                || (vars.CMDCTRL_DEV_PUBLIC_BASE_URL || 'https://cmd-dev.labxp.io') }}
        run: |
          printf '%s' "${PUBLIC_BASE_URL}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            'sudo /opt/cmd_and_ctrl/scripts/set-server-env.sh CMDCTRL_PUBLIC_BASE_URL'

      # Facts about how these hosts are reached, not preferences, so they are
      # set unconditionally rather than exposed as variables.
      #
      # TRUST_FORWARDED: cloudflared forwards to Caddy from 127.0.0.1, so every
      # request reaches the server from the loopback address. Without this the
      # per-IP rate limiters key every client in the world to one bucket -- see
      # the avatar limiter in server/internal/lobby/http.go.
      #
      # SECURE_COOKIES: the browser's connection is https at the Cloudflare
      # edge even though this origin speaks plain http, so session cookies
      # should carry Secure.
      - name: Sync server env (proxy and cookie flags)
        run: |
          for KEY in CMDCTRL_TRUST_FORWARDED CMDCTRL_SECURE_COOKIES; do
            printf '%s' "1" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo /opt/cmd_and_ctrl/scripts/set-server-env.sh ${KEY}"
            echo "set ${KEY}=1"
          done

      # Discord OAuth and bot credentials. The server reads all six (see
      # server/internal/discord); none of them were provisioned by any
      # pipeline before this, which is why /auth/discord could not work even
      # once Caddy started proxying it.
      #
      # Every key is optional and skipped with a warning when unset, matching
      # the bug-report token step: a half-configured Discord app leaves sign-in
      # off rather than failing the whole deploy.
      #
      # REDIRECT_URI necessarily differs per target and BOTH values must be
      # registered as redirects on the Discord application, or the callback is
      # rejected by Discord before it ever reaches this server.
      - name: Sync server env (Discord)
        env:
          CMDCTRL_DISCORD_APP_ID: ${{ secrets.CMDCTRL_DISCORD_APP_ID }}
          CMDCTRL_DISCORD_CLIENT_ID: ${{ secrets.CMDCTRL_DISCORD_CLIENT_ID }}
          CMDCTRL_DISCORD_CLIENT_SECRET: ${{ secrets.CMDCTRL_DISCORD_CLIENT_SECRET }}
          CMDCTRL_DISCORD_BOT_TOKEN: ${{ secrets.CMDCTRL_DISCORD_BOT_TOKEN }}
          CMDCTRL_DISCORD_GUILD_IDS: ${{ vars.CMDCTRL_DISCORD_GUILD_IDS }}
          CMDCTRL_DISCORD_REDIRECT_URI: >-
            ${{ github.ref == 'refs/heads/main'
                && vars.CMDCTRL_DISCORD_REDIRECT_URI
                || vars.CMDCTRL_DEV_DISCORD_REDIRECT_URI }}
        run: |
          missing=0
          for KEY in CMDCTRL_DISCORD_APP_ID CMDCTRL_DISCORD_CLIENT_ID \
                     CMDCTRL_DISCORD_CLIENT_SECRET CMDCTRL_DISCORD_BOT_TOKEN \
                     CMDCTRL_DISCORD_GUILD_IDS CMDCTRL_DISCORD_REDIRECT_URI; do
            VALUE="${!KEY}"
            if [ -z "${VALUE}" ]; then
              echo "::warning::${KEY} is not configured; skipping."
              missing=$((missing + 1))
              continue
            fi
            printf '%s' "${VALUE}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo /opt/cmd_and_ctrl/scripts/set-server-env.sh ${KEY}"
            echo "set ${KEY}"
          done
          if [ "${missing}" -gt 0 ]; then
            echo "::notice::${missing} Discord key(s) unset -- Discord sign-in stays disabled until all six are configured."
          fi

      - name: Restart cmd-and-ctrl service
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} 'sudo systemctl restart cmd-and-ctrl'

      - name: Restart cmd-and-ctrl-bot service (if enabled)
        # Conditional so CI keeps passing before the operator
        # installs the bot systemd unit for the first time.
        # Once the unit is enabled, this branch is the steady state.
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            if systemctl is-enabled cmd-and-ctrl-bot >/dev/null 2>&1; then
              sudo systemctl restart cmd-and-ctrl-bot
              systemctl is-active cmd-and-ctrl-bot
            else
              echo "cmd-and-ctrl-bot unit is not enabled; skipping bot restart."
            fi
          '

      - name: Verify service is active
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            'systemctl is-active cmd-and-ctrl && systemctl status cmd-and-ctrl --no-pager --lines=10'
