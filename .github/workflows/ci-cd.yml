name: cmd_and_ctrl CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: cmdctrl-cd-${{ github.ref }}
  # Cancel superseded runs on PRs/topic branches so the single
  # self-hosted runner doesn't queue stale builds. Keep the two
  # deploying branches serialized (never cancel) so an in-flight
  # deploy can't be aborted mid-rsync.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  cmdctrl-ci:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests-e2e/package-lock.json

      - name: Server — gofmt check
        working-directory: server
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Server — vet
        working-directory: server
        run: go vet ./...

      - name: Server — test
        working-directory: server
        run: go test -race -cover ./...

      - name: Server — build
        working-directory: server
        run: |
          mkdir -p bin
          go build -o bin/cmd_and_ctrl-server ./cmd/server

      - name: Bot — build
        working-directory: server
        run: go build -o bin/cmd_and_ctrl-bot ./cmd/bot

      - name: Client — npm ci
        working-directory: client
        run: npm ci

      - name: Client — typecheck
        working-directory: client
        run: npm run check

      - name: Client — unit tests
        working-directory: client
        run: npm test

      - name: Client — lint
        working-directory: client
        run: npm run lint

      # `npm run build` is `svelte-check && vite build`; the typecheck
      # step above already ran svelte-check, so invoke vite directly to
      # avoid running it twice. Local `npm run build` is unchanged.
      - name: Client — build
        working-directory: client
        run: npx vite build

      - name: Tests-e2e — npm ci
        working-directory: tests-e2e
        run: npm ci

      - name: Tests-e2e — typecheck
        working-directory: tests-e2e
        run: npx tsc --noEmit

      - name: Upload server binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-server-bin
          path: server/bin/cmd_and_ctrl-server
          retention-days: 7

      - name: Upload bot binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-bot-bin
          path: server/bin/cmd_and_ctrl-bot
          retention-days: 7

      - name: Upload client dist
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-client-dist
          path: client/dist/
          retention-days: 7

  cmdctrl-cd:
    runs-on: self-hosted
    needs: cmdctrl-ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    env:
      CMDCTRL_HOST: ${{ vars.CMDCTRL_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10
      # Everything below is the only difference between deploying
      # production and deploying the develop preview. Both live on the
      # same host (ADR 0023); they share nothing but the box and a
      # read-only Scryfall dump.
      IS_DEV: ${{ github.ref == 'refs/heads/develop' }}
      DEPLOY_ROOT: >-
        ${{ github.ref == 'refs/heads/develop' && '/opt/cmd_and_ctrl-dev' || '/opt/cmd_and_ctrl' }}
      WEB_ROOT: >-
        ${{ github.ref == 'refs/heads/develop' && '/var/www/cmdctrl-client-dev' || '/var/www/cmdctrl-client' }}
      ENV_FILE: >-
        ${{ github.ref == 'refs/heads/develop' && '/etc/cmd_and_ctrl/dev.env' || '/etc/cmd_and_ctrl/env' }}
      SERVICE: >-
        ${{ github.ref == 'refs/heads/develop' && 'cmd-and-ctrl-dev' || 'cmd-and-ctrl' }}
      APP_ENV: ${{ github.ref == 'refs/heads/develop' && 'dev' || 'prod' }}
      # Loopback port the service binds (CMDCTRL_ADDR in its env file).
      # Used only by the post-deploy environment check below.
      LOCAL_PORT: ${{ github.ref == 'refs/heads/develop' && '8081' || '8080' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify CMDCTRL_HOST is set
        run: |
          if [ -z "${CMDCTRL_HOST}" ]; then
            echo "::error::Repo variable CMDCTRL_HOST is not set. Configure under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          echo "Deploy target: krkn@${CMDCTRL_HOST}"
          echo "Environment:   ${APP_ENV}"
          echo "Service:       ${SERVICE}"
          echo "Deploy root:   ${DEPLOY_ROOT}"
          echo "Web root:      ${WEB_ROOT}"

      - name: Download server binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-server-bin
          path: server/bin

      - name: Download bot binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-bot-bin
          path: server/bin

      - name: Download client dist
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-client-dist
          path: client/dist

      - name: Restore server binary exec bit
        run: chmod +x server/bin/cmd_and_ctrl-server server/bin/cmd_and_ctrl-bot

      - name: Deploy server binary
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-server \
            krkn@${CMDCTRL_HOST}:${DEPLOY_ROOT}/server/bin/

      # Production only, on purpose. A second bot process logged into
      # the same Discord application would answer every slash command
      # twice; the develop deployment therefore never ships or restarts
      # the bot. Slash commands are tested against prod or a private
      # test guild, not here. See ADR 0023 sec. "Discord".
      - name: Deploy bot binary
        if: env.IS_DEV != 'true'
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-bot \
            krkn@${CMDCTRL_HOST}:/opt/cmd_and_ctrl/bot/bin/ || {
              echo "::warning::Bot deploy skipped — /opt/cmd_and_ctrl/bot/bin/ may not exist yet. Create it on the host before the bot rolls out."
            }

      - name: Deploy client dist
        run: |
          rsync -a --delete -e "ssh ${SSH_OPTS}" \
            client/dist/ \
            krkn@${CMDCTRL_HOST}:${WEB_ROOT}/

      - name: Deploy scripts
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            scripts/ \
            krkn@${CMDCTRL_HOST}:${DEPLOY_ROOT}/scripts/
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "chmod +x ${DEPLOY_ROOT}/scripts/"'*.sh'

      # Provision the bug-report token (ADR 0017) into the server's
      # env file (/etc/cmd_and_ctrl/env — written by the HomeLab
      # cloud-init template, read by the systemd units) so nobody has
      # to touch the host by hand. Source of truth is the
      # CMDCTRL_GITHUB_TOKEN Actions secret; rotation = update the
      # secret, rerun the deploy. The value travels over stdin (never
      # ssh argv) so it can't surface in `ps` on the host; Actions
      # masks it in logs. Runs after "Deploy scripts" (which lands
      # set-server-env.sh) and before the restart that picks it up.
      # Skips cleanly when the secret isn't configured — bug
      # reporting simply stays disabled, same as an unset var. sudo
      # because the env file is root:cmdctrl; krkn's cloud-init
      # sudoers grant covers it (same as the restart steps).
      # Stamp the deployment identity into the env file on every
      # deploy of both branches. This is what makes the environments
      # unable to drift: prod is rewritten to CMDCTRL_ENV=prod even if
      # someone hand-edited it to dev, and vice versa. The server
      # refuses to boot on an unrecognised value, and every dev-only
      # route and action is gated on it server-side (ADR 0023).
      - name: Sync server env (deployment identity)
        run: |
          printf '%s' "${APP_ENV}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_ENV ${ENV_FILE}"

      - name: Sync server env (bug-report token)
        env:
          BUGREPORT_TOKEN: ${{ secrets.CMDCTRL_GITHUB_TOKEN }}
        run: |
          if [ -z "${BUGREPORT_TOKEN}" ]; then
            echo "CMDCTRL_GITHUB_TOKEN secret not set; skipping (bug reporting stays disabled)."
            exit 0
          fi
          printf '%s' "${BUGREPORT_TOKEN}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_GITHUB_TOKEN ${ENV_FILE}"

      # Bug-report screenshots need a PUBLIC origin: a GitHub issue can
      # only render an image its proxy can fetch, so the server has to
      # know the URL it is reachable at from the outside. Not a secret —
      # a repo variable, defaulting to the production hostname — but
      # provisioned the same way so the env file stays the single source
      # of truth on the host. Unset leaves attachments off and text
      # reports working (see ADR 0017 §6).
      - name: Sync server env (public base URL)
        env:
          PUBLIC_BASE_URL: >-
            ${{ github.ref == 'refs/heads/develop'
                && (vars.CMDCTRL_DEV_PUBLIC_BASE_URL || 'https://dev.cmd.labxp.io')
                || (vars.CMDCTRL_PUBLIC_BASE_URL || 'https://cmd.labxp.io') }}
        run: |
          printf '%s' "${PUBLIC_BASE_URL}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_PUBLIC_BASE_URL ${ENV_FILE}"

      - name: Restart game server service
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "sudo systemctl restart ${SERVICE}"

      - name: Restart cmd-and-ctrl-bot service (if enabled)
        # Production only — see "Deploy bot binary" above.
        if: env.IS_DEV != 'true'
        # Conditional so CI keeps passing before the operator
        # installs the bot systemd unit for the first time.
        # Once the unit is enabled, this branch is the steady state.
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            if systemctl is-enabled cmd-and-ctrl-bot >/dev/null 2>&1; then
              sudo systemctl restart cmd-and-ctrl-bot
              systemctl is-active cmd-and-ctrl-bot
            else
              echo "cmd-and-ctrl-bot unit is not enabled; skipping bot restart."
            fi
          '

      - name: Verify service is active
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "systemctl is-active ${SERVICE} && systemctl status ${SERVICE} --no-pager --lines=10"

      # Prove the deployment is answering as the environment we just
      # told it to be. Catches the failure this whole scheme exists to
      # prevent: a develop deploy that comes up believing it is prod,
      # or — far worse — a main deploy that comes up as dev with card
      # spawning enabled on the live table.
      #
      # Queried over loopback on the host so it tests the service
      # itself, not the reverse proxy or DNS.
      - name: Verify reported environment
        run: |
          body=$(ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "curl -fsS --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:${LOCAL_PORT}/config")
          echo "GET /config -> ${body}"
          case "${body}" in
            *'"env":"'"${APP_ENV}"'"'*) ;;
            *)
              echo "::error::${SERVICE} did not report env=${APP_ENV}. Check CMDCTRL_ENV in ${ENV_FILE}."
              exit 1
              ;;
          esac
          echo "Confirmed: ${SERVICE} is running as ${APP_ENV}."
