name: cmd_and_ctrl CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Validate any branch on demand: Actions -> this workflow -> Run workflow.
  #
  # Topic-branch pushes deliberately trigger nothing (the push filter above is
  # main/develop only), so a branch that never opens a pull request gets no
  # build, no tests and no gofmt. That is a real gap when work is prepared on
  # a branch before anyone is ready to open a PR for it.
  #
  # This is deploy-safe by construction: cmdctrl-cd is gated on
  # `github.event_name == 'push'`, so a manual run can only ever execute
  # cmdctrl-ci. The artifact-upload steps are gated the same way, so a
  # dispatch also publishes nothing -- it compiles, tests and typechecks,
  # and stops there.
  workflow_dispatch:
  # The merge queue. GitHub builds a temporary
  # refs/heads/gh-readonly-queue/... ref containing this PR stacked on
  # main plus everything ahead of it in the queue, and waits for the
  # required checks to pass on THAT ref before merging.
  #
  # This is the trigger that makes the queue work at all: without it no
  # run is ever dispatched for a queued entry, the required check never
  # reports, and every merge sits until it times out.
  #
  # It is also the fix for the class of breakage that took main down on
  # 2026-09-11: two PRs each added a GoldToken to different regions of
  # tokens.go, so neither conflicted textually and both were green
  # against the main that existed before the other landed. Nothing
  # built the combination until after both had merged. The queue builds
  # exactly that combination, before.
  merge_group:

concurrency:
  group: cmdctrl-cd-${{ github.ref }}
  # Cancel superseded runs on PRs/topic branches so the single
  # self-hosted runner doesn't queue stale builds. Keep both deploy
  # branches serialized (never cancel) so an in-flight deploy can't be
  # aborted mid-rsync -- that would leave a host with a new binary and
  # a half-written client bundle.
  # Never cancel a merge-queue run: the queue is waiting on that exact
  # check to report, and a cancelled run reads as a failure that ejects
  # the PR from the queue.
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  cmdctrl-ci:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # cache: false on purpose. These are self-hosted runners, so
      # $HOME survives between jobs and ~/go/pkg/mod is already warm --
      # there is nothing for a cache to restore that is not already
      # there. Worse, Go marks the module cache read-only (files 0444,
      # dirs 0555), so actions/cache untarring over it fails with
      #   /usr/bin/tar: .../openpgp/errors: Cannot mkdir: No such file
      #   ##[warning]Failed to restore: "/usr/bin/tar" ... exit code 2
      # on every run, then silently re-downloads the whole module set.
      # Note the Scryfall cache below is NOT affected and stays on: its
      # path is inside the workspace, not $HOME.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      # One self-hosted runner, no job-level cleanup: the Go build cache
      # under $HOME and orphaned /tmp/go-build* trees left by cancelled
      # runs grow without bound, and on 2026-09-18 the disk filled
      # mid-test three branches in a row (#892). Trim before building.
      # The cache is only dropped when the disk is actually low, so a
      # healthy runner keeps its warm cache and the ~1-2 min rebuild
      # cost is paid only when it would otherwise fail.
      - name: Free runner disk
        shell: bash
        run: |
          df -h / /tmp | sed 's/^/before: /'
          rm -rf /tmp/go-build* 2>/dev/null || true
          avail_kb=$(df --output=avail -k / | tail -1 | tr -d ' ')
          if [ "${avail_kb:-0}" -lt 15728640 ]; then
            echo "under 15 GB free: dropping the Go build and test caches"
            go clean -cache -testcache
          fi
          if command -v docker >/dev/null 2>&1; then
            docker system prune -f >/dev/null 2>&1 || true
          fi
          df -h / /tmp | sed 's/^/after: /'

      # No `cache:` input, for the same reason as Go above -- ~/.npm
      # persists on a self-hosted runner and restoring over it fails the
      # same way. Note setup-node's `cache` is an enum of package
      # managers (npm/yarn/pnpm), NOT a boolean: `cache: false` is a
      # hard error ("Caching for 'false' is not supported"). Omitting
      # the input is how you turn it off.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Server — gofmt check
        working-directory: server
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Server — vet
        working-directory: server
        run: go vet ./...

      - name: Server — lint
        working-directory: server
        # golangci-lint v1.64.8 via `go run` (see server/Makefile): the
        # repo's .golangci.yml, with errcheck and unparam excluded in
        # test files. Wired in by #582 once the tree was clean under it.
        #
        # GOTOOLCHAIN=auto is load-bearing and belongs to THIS step
        # only. setup-go v6 exports GOTOOLCHAIN=local for the whole job
        # (v5 left Go's own `auto` default in place), and golangci-lint
        # v1.64.8 requires go >= 1.23 while the job is pinned to the
        # 1.22 that go.mod supports. Under `local` the `go run` above
        # refuses outright:
        #   go: ...golangci-lint@v1.64.8 requires go >= 1.23.0
        #   (running go 1.22.12; GOTOOLCHAIN=local)
        # Under `auto` it fetches the toolchain the TOOL needs and
        # leaves the toolchain the SERVER builds and tests with alone,
        # which is what v5 was silently doing. Scoped to the step so
        # gofmt, vet, test and build cannot quietly drift off 1.22.
        env:
          GOTOOLCHAIN: auto
        run: make lint

      - name: Server — test
        working-directory: server
        # -timeout 30m, not Go's 10m default. internal/aiseat runs whole
        # four-bot games as unit tests -- the fuzzer, the heuristic
        # head-to-head, and the model funnel's outage drill -- and under
        # -race on a shared self-hosted runner that package alone pushed
        # past 600s the moment S31 sub-PR 7 landed, failing every open PR
        # with "FAIL internal/aiseat 600.0xx" and nothing else to go on.
        #
        # The 10m default is per test BINARY, so it is really a
        # per-package budget and aiseat is the only package near it. 30m
        # is headroom, not a target: if aiseat approaches it again the
        # answer is to ration whole games (sub-PR 7 already trimmed once),
        # not to raise this further.
        run: go test -race -cover -timeout 30m ./...

      - name: Server — build
        working-directory: server
        run: |
          mkdir -p bin
          go build -o bin/cmd_and_ctrl-server ./cmd/server

      - name: Bot — build
        working-directory: server
        run: go build -o bin/cmd_and_ctrl-bot ./cmd/bot

      - name: Client — npm ci
        working-directory: client
        run: npm ci

      - name: Client — typecheck
        working-directory: client
        run: npm run check

      - name: Client — unit tests
        working-directory: client
        run: npm test

      - name: Client — lint
        working-directory: client
        run: npm run lint

      # `npm run build` is `svelte-check && vite build`; the typecheck
      # step above already ran svelte-check, so invoke vite directly to
      # avoid running it twice. Local `npm run build` is unchanged.
      - name: Client — build
        working-directory: client
        run: npx vite build

      - name: Tests-e2e — npm ci
        working-directory: tests-e2e
        run: npm ci

      - name: Tests-e2e — typecheck
        working-directory: tests-e2e
        run: npx tsc --noEmit

      - name: Upload server binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-server-bin
          path: server/bin/cmd_and_ctrl-server
          retention-days: 7

      - name: Upload bot binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-bot-bin
          path: server/bin/cmd_and_ctrl-bot
          retention-days: 7

      - name: Upload client dist
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: cmdctrl-client-dist
          path: client/dist/
          retention-days: 7

  cmdctrl-cd:
    runs-on: self-hosted
    needs: cmdctrl-ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # GitHub environment, for secrets and variables that differ per host
    # (today: the off-site backup's). `prod` accepts deployments from main
    # only and `dev` from develop only (deployment branch policies), so a
    # topic branch can never read production's values. Both arms are
    # non-empty literals, so the ternary fall-through hazard described on
    # "Resolve deploy target" cannot occur here. Repo-level secrets and
    # variables are still visible to the job exactly as before.
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    env:
      # Production and the develop preview are two VMs on the same
      # Proxmox node, identical below the fqdn (ADR 0023). So this job
      # branches on exactly two things -- which host it talks to, and
      # which environment it tells the service it is -- and on nothing
      # else. Every path, the unit name and the listen port are the
      # same constants for both targets. That is what makes a preview
      # deploy a rehearsal of the production deploy rather than a
      # lookalike of it.
      #
      # Anything that is not `main` deploys as dev. Written in that
      # direction on purpose: the job's `if` already admits only main
      # and develop, and if that ever loosens, an unrecognised ref comes
      # up as a dev preview rather than as production.
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      # Gates the Discord bot steps (binary, unit, bot.env, restart).
      # Nothing else branches on it; see "Deploy bot binary" for why
      # the bot is the exception.
      IS_DEV: ${{ github.ref != 'refs/heads/main' }}
      # "true" or "false": whether the CMDCTRL_DISCORD_BOT_TOKEN secret is
      # non-empty. Only the comparison is evaluated here, never the token,
      # so this is safe to read in any step. It decides how loud the
      # production bot steps are about a host that cannot run the bot (no
      # cmdctrl-bot user or group, unit not enabled, unit not active after
      # its restart): unset means the bot is not wanted yet, so a quiet
      # ::notice::; set means it is, so a ::warning::. Neither fails the
      # deploy. Consumed only by the bot steps, which are all prod-gated.
      BOT_TOKEN_SET: ${{ secrets.CMDCTRL_DISCORD_BOT_TOKEN != '' }}

      SSH_OPTS: -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10

      # Identical on both VMs -- written by the HomeLab cloud-init
      # template, which is the single source of truth for both hosts.
      # Named here rather than inlined so the steps below read the same
      # whichever target they are pointed at, and so the resolve step
      # can print the whole target in one place.
      DEPLOY_ROOT: /opt/cmd_and_ctrl
      WEB_ROOT: /var/www/cmdctrl-client
      ENV_FILE: /etc/cmd_and_ctrl/env
      # Production only. The bot's own env file, root:cmdctrl-bot 0640,
      # read by cmd-and-ctrl-bot.service (EnvironmentFile=). Written by
      # "Sync bot env"; never exists on the preview.
      BOT_ENV_FILE: /etc/cmd_and_ctrl/bot.env
      SERVICE: cmd-and-ctrl
      # Loopback port the service binds (CMDCTRL_ADDR in its env file).
      # Used only by the post-deploy environment check below.
      LOCAL_PORT: "8080"

      # CMDCTRL_HOST is deliberately NOT declared here. It is resolved
      # in the first step and exported through $GITHUB_ENV; see there.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The deploy target is resolved in shell rather than with a
      # `${{ cond && vars.A || vars.B }}` ternary, on purpose. That
      # ternary is unsafe for exactly this pair: GitHub's `&&`/`||`
      # falls through on an empty value, so if CMDCTRL_HOST were ever
      # unset, `github.ref == 'refs/heads/main' && vars.CMDCTRL_HOST`
      # evaluates to the empty string, which is falsy, and the whole
      # expression falls through to the `||` branch -- a push to *main*
      # would then deploy production onto the preview box. A "is the
      # host set" guard cannot catch that: by the time it runs, the
      # expression has already collapsed to a non-empty dev hostname.
      # The same hazard exists in the other direction for an unset
      # CMDCTRL_DEV_HOST, which would put develop, dev features and
      # all, onto production.
      #
      # Resolving in shell turns both of those into a failed run that
      # names the variable it wants.
      - name: Resolve deploy target
        env:
          PROD_HOST: ${{ vars.CMDCTRL_HOST }}
          DEV_HOST: ${{ vars.CMDCTRL_DEV_HOST }}
        run: |
          if [ "${IS_DEV}" = "true" ]; then
            host="${DEV_HOST}"
            host_var="CMDCTRL_DEV_HOST"
          else
            host="${PROD_HOST}"
            host_var="CMDCTRL_HOST"
          fi

          if [ -z "${host}" ]; then
            echo "::error::Repo variable ${host_var} is not set, so ${GITHUB_REF_NAME} has nowhere to deploy. Configure under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          # Both variables pointing at the same box is the single
          # mistake that turns a preview deploy into a production
          # outage: the paths are identical on the two VMs, so a
          # develop deploy aimed at production's host would overwrite
          # production in place and stamp CMDCTRL_ENV=dev on it. Cheap
          # to check, so check it.
          if [ "${IS_DEV}" = "true" ] && [ "${host}" = "${PROD_HOST}" ]; then
            echo "::error::CMDCTRL_DEV_HOST and CMDCTRL_HOST both point at ${host}. These are meant to be separate VMs; deploying develop here would overwrite production."
            exit 1
          fi

          echo "CMDCTRL_HOST=${host}" >> "${GITHUB_ENV}"

          echo "Deploy target: krkn@${host}  (from ${host_var})"
          echo "Environment:   ${APP_ENV}"
          echo "Service:       ${SERVICE}, 127.0.0.1:${LOCAL_PORT}"
          echo "Deploy root:   ${DEPLOY_ROOT}"
          echo "Web root:      ${WEB_ROOT}"
          echo "Env file:      ${ENV_FILE}"

      - name: Download server binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-server-bin
          path: server/bin

      - name: Download bot binary
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-bot-bin
          path: server/bin

      - name: Download client dist
        uses: actions/download-artifact@v6
        with:
          name: cmdctrl-client-dist
          path: client/dist

      - name: Restore server binary exec bit
        run: chmod +x server/bin/cmd_and_ctrl-server server/bin/cmd_and_ctrl-bot

      - name: Deploy server binary
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-server \
            krkn@${CMDCTRL_HOST}:${DEPLOY_ROOT}/server/bin/

      # Production only, on purpose -- this, "Install bot systemd unit",
      # "Sync bot env" and the bot restart below are the only genuinely
      # prod-only steps in this job. A second bot process logged into the
      # same Discord application answers every slash command twice, so the
      # develop deployment never ships, configures or restarts the bot.
      # Slash commands are tested against production or a private test
      # guild. See ADR 0023 sec. 6.
      #
      # The directory is created here rather than by cloud-init: rsync
      # creates only the last path component, and the running VM carries
      # ignore_changes on its cloud-init, so a template change would never
      # reach it. krkn owns ${DEPLOY_ROOT}, so no sudo. With the directory
      # guaranteed, any rsync or ssh failure is real and fails the job.
      - name: Deploy bot binary
        if: env.IS_DEV != 'true'
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "mkdir -p ${DEPLOY_ROOT}/bot/bin"
          rsync -a -e "ssh ${SSH_OPTS}" \
            server/bin/cmd_and_ctrl-bot \
            krkn@${CMDCTRL_HOST}:${DEPLOY_ROOT}/bot/bin/

      # Production only -- see "Deploy bot binary". Installs the unit from
      # this repo so a change to deploy/cmd-and-ctrl-bot.service reaches the
      # host without anyone copying it by hand.
      #
      # Installs and daemon-reloads only when the content, owner or mode
      # differ; a missing unit counts as different. It does NOT enable the
      # unit. Enabling is the operator's deliberate switch (see
      # deploy/README.md; needed again after every rebuild of production),
      # and "Restart cmd-and-ctrl-bot service (if enabled)" keys on it --
      # so an unprovisioned host keeps deploying green instead of
      # crash-looping a bot with no bot.env. That step, not this one,
      # reports a unit that is not enabled.
      - name: Install bot systemd unit
        if: env.IS_DEV != 'true'
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" deploy/cmd-and-ctrl-bot.service \
            krkn@${CMDCTRL_HOST}:/tmp/cmd-and-ctrl-bot.service.new
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            set -eu
            NEW=/tmp/cmd-and-ctrl-bot.service.new
            UNIT=/etc/systemd/system/cmd-and-ctrl-bot.service
            trap "rm -f $NEW" EXIT
            if [ -f "$UNIT" ] && cmp -s "$NEW" "$UNIT" \
               && [ "$(stat -c "%U:%G %a" "$UNIT")" = "root:root 644" ]; then
              echo "cmd-and-ctrl-bot.service unchanged."
            else
              sudo install -o root -g root -m 0644 "$NEW" "$UNIT"
              sudo systemctl daemon-reload
              echo "cmd-and-ctrl-bot.service installed; daemon reloaded."
            fi
          '

      - name: Deploy client dist
        run: |
          rsync -a --delete -e "ssh ${SSH_OPTS}" \
            client/dist/ \
            krkn@${CMDCTRL_HOST}:${WEB_ROOT}/

      - name: Deploy scripts
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" \
            scripts/ \
            krkn@${CMDCTRL_HOST}:${DEPLOY_ROOT}/scripts/
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "chmod +x ${DEPLOY_ROOT}/scripts/"'*.sh'

      # Caddy's config ships from this repo because its @api matcher mirrors
      # the server's route table (see deploy/Caddyfile). The HomeLab cloud-init
      # template only writes a first-boot placeholder and cannot update a
      # running host -- that VM carries lifecycle ignore_changes on its
      # cloud-init -- so this step is the only thing that maintains it.
      #
      # Runs on both hosts, ungated. The file names no fqdn -- it is a `:80`
      # site behind the tunnel -- so it is the same config on the preview as
      # on production. Skipping it on dev would leave the preview serving
      # index.html for the dev routes, which looks exactly like a preview
      # whose features are switched off.
      #
      # RESTART, not reload. The unit's ExecReload is
      # `caddy reload --config ... --force`, which pushes the config through the
      # admin API on localhost:2019, and deploy/Caddyfile sets `admin off`. So
      # reload always fails with "connection refused" no matter how valid the
      # config is. Caddy restarts in well under a second and the tunnel
      # reconnects on its own.
      #
      # And it restarts unconditionally rather than only when the file changed.
      # With `admin off` there is no way to ask Caddy what it is currently
      # serving, so "the file on disk matches the repo" does not prove "Caddy
      # loaded it" -- those diverge exactly when a previous deploy installed the
      # file and then failed to reload, which is how this bug was found. An
      # unconditional restart is the only version of this step that heals that
      # state instead of preserving it forever.
      #
      # Validated before installation, so a broken config fails the deploy
      # rather than taking the site down. If the restart itself fails the
      # previous file is put back and Caddy restarted again, so the site does
      # not stay down on a config that passed validation but not startup.
      - name: Deploy Caddy config
        run: |
          rsync -a -e "ssh ${SSH_OPTS}" deploy/Caddyfile \
            krkn@${CMDCTRL_HOST}:/tmp/Caddyfile.new
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            set -eu
            caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
            BACKUP="/etc/caddy/Caddyfile.bak.$(date +%Y%m%d-%H%M%S)"
            sudo cp -a /etc/caddy/Caddyfile "$BACKUP"
            sudo install -o root -g root -m 0644 /tmp/Caddyfile.new /etc/caddy/Caddyfile
            if sudo systemctl restart caddy; then
              echo "Caddy restarted with the config from this deploy."
            else
              echo "::error::Caddy failed to start; restoring $BACKUP" >&2
              sudo install -o root -g root -m 0644 "$BACKUP" /etc/caddy/Caddyfile
              sudo systemctl restart caddy || true
              exit 1
            fi
            systemctl is-active caddy
            rm -f /tmp/Caddyfile.new
          '

      # Stamp the deployment identity into the env file on every deploy
      # of both branches. This is what makes the two environments unable
      # to drift: production is rewritten to CMDCTRL_ENV=prod even if
      # someone hand-edited it to dev, and the preview to dev even if it
      # was hand-edited to prod. The server refuses to boot on an
      # unrecognised value, and every dev-only route and action is gated
      # on it server-side (ADR 0023).
      #
      # Deliberately not gated on IS_DEV: writing it on only one branch
      # would leave the other free to drift, which is the failure this
      # step exists to remove.
      - name: Sync server env (deployment identity)
        run: |
          printf '%s' "${APP_ENV}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_ENV ${ENV_FILE}"

      # Provision the bug-report token (ADR 0017) into the server's
      # env file (/etc/cmd_and_ctrl/env — written by the HomeLab
      # cloud-init template, read by the systemd units) so nobody has
      # to touch the host by hand. Source of truth is the
      # CMDCTRL_GITHUB_TOKEN Actions secret; rotation = update the
      # secret, rerun the deploy. The value travels over stdin (never
      # ssh argv) so it can't surface in `ps` on the host; Actions
      # masks it in logs. Runs after "Deploy scripts" (which lands
      # set-server-env.sh) and before the restart that picks it up.
      # Skips cleanly when the secret isn't configured — bug
      # reporting simply stays disabled, same as an unset var. sudo
      # because the env file is root:cmdctrl; krkn's cloud-init
      # sudoers grant covers it (same as the restart steps).
      #
      # Set on both hosts so the preview can rehearse bug reporting,
      # which is a feature that has to be exercised somewhere before it
      # reaches production. The cost is that a preview report files its
      # issue under the same identity as a production one; the report
      # body carries the environment it came from, and the alternative
      # -- a preview where the button silently does nothing -- is
      # worse. Add `if: env.IS_DEV != 'true'` here if that trade ever
      # stops being worth it.
      - name: Sync server env (bug-report token)
        env:
          BUGREPORT_TOKEN: ${{ secrets.CMDCTRL_GITHUB_TOKEN }}
        run: |
          if [ -z "${BUGREPORT_TOKEN}" ]; then
            echo "CMDCTRL_GITHUB_TOKEN secret not set; skipping (bug reporting stays disabled)."
            exit 0
          fi
          printf '%s' "${BUGREPORT_TOKEN}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_GITHUB_TOKEN ${ENV_FILE}"

      # Bug-report screenshots need a PUBLIC origin: a GitHub issue can
      # only render an image its proxy can fetch, so the server has to
      # know the URL it is reachable at from the outside. Not a secret —
      # a repo variable per environment, defaulting to that
      # environment's fqdn — but provisioned the same way so the env
      # file stays the single source of truth on the host. Unset leaves
      # attachments off and text reports working (see ADR 0017 §6).
      #
      # Selected in shell rather than with a `${{ }}` ternary, for the
      # reason given on "Resolve deploy target".
      - name: Sync server env (public base URL)
        env:
          PROD_BASE_URL: ${{ vars.CMDCTRL_PUBLIC_BASE_URL }}
          DEV_BASE_URL: ${{ vars.CMDCTRL_DEV_PUBLIC_BASE_URL }}
        run: |
          if [ "${IS_DEV}" = "true" ]; then
            base_url="${DEV_BASE_URL:-https://cmd-dev.labxp.io}"
          else
            base_url="${PROD_BASE_URL:-https://cmd.labxp.io}"
          fi
          echo "public base URL: ${base_url}"
          printf '%s' "${base_url}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_PUBLIC_BASE_URL ${ENV_FILE}"

      # Facts about how these hosts are reached, not preferences, so they are
      # set unconditionally rather than exposed as variables. True of both VMs
      # -- they sit behind the same cloudflared/Caddy arrangement -- so this
      # step does not branch on the ref either.
      #
      # TRUST_FORWARDED: cloudflared forwards to Caddy from 127.0.0.1, so every
      # request reaches the server from the loopback address. Without this the
      # per-IP rate limiters key every client in the world to one bucket -- see
      # the avatar limiter in server/internal/lobby/http.go.
      #
      # SECURE_COOKIES: the browser's connection is https at the Cloudflare
      # edge even though this origin speaks plain http, so session cookies
      # should carry Secure.
      - name: Sync server env (proxy and cookie flags)
        run: |
          for KEY in CMDCTRL_TRUST_FORWARDED CMDCTRL_SECURE_COOKIES; do
            printf '%s' "1" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh ${KEY} ${ENV_FILE}"
            echo "set ${KEY}=1"
          done

      # Session signing key (#517, ADR 0044 decision 3). Without it the
      # server holds sessions in memory and every deploy logs every player
      # out; with it, a token minted before the restart validates after.
      #
      # Generated ON THE HOST, once, and then left alone. Not an Actions
      # secret: nothing but this server ever needs it, so it never has to
      # leave the VM, and each host gets its own (a preview token must not
      # validate on production). Rewriting it on every deploy would be the
      # exact bug it exists to fix -- a new key invalidates every session.
      # To rotate (logs everyone out): delete the line from ${ENV_FILE} and
      # redeploy.
      #
      # The key must be at least 32 bytes and must differ from
      # CMDCTRL_ADMIN_TOKEN; the server refuses to boot otherwise. 48
      # random bytes base64-encode to 64 characters.
      #
      # Identity key (S34 sub-PR 2, ADR 0051 decision 5): encrypts the
      # Discord refresh tokens stored on identities rows. Same pattern and
      # same reasons -- generated here once per host, never rewritten, never
      # an Actions secret. It must also be at least 32 bytes and differ from
      # the admin token and the session key (two independent draws from
      # /dev/urandom do). Without it sign-in still works and refresh tokens
      # are discarded; rotating it makes the stored ones unreadable but logs
      # nobody out.
      - name: Ensure server env (session signing and identity keys)
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            if sudo grep -qE '^CMDCTRL_SESSION_KEY=.{32,}' ${ENV_FILE}; then
              echo 'CMDCTRL_SESSION_KEY already set; leaving it (rotating it logs everyone out).'
            else
              head -c 48 /dev/urandom | base64 -w0 | sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_SESSION_KEY ${ENV_FILE}
            fi
            if sudo grep -qE '^CMDCTRL_IDENTITY_KEY=.{32,}' ${ENV_FILE}; then
              echo 'CMDCTRL_IDENTITY_KEY already set; leaving it (rotating it makes stored refresh tokens unreadable).'
            else
              head -c 48 /dev/urandom | base64 -w0 | sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_IDENTITY_KEY ${ENV_FILE}
            fi
          "

      # Discord OAuth sign-in. All three are required -- discord.Config.Enabled()
      # is false if any is blank, /auth/discord/start returns 503 and the client
      # hides the sign-in button via /auth/discord/config -- so they are set
      # together or not at all.
      #
      # Set on both hosts, ungated: signing in is most of what a preview is
      # for. The client id and secret are shared; only the redirect differs.
      #
      # REDIRECT_URI must EXACTLY match a redirect registered on the Discord
      # application, and prod and dev necessarily differ, so both values must be
      # registered there -- https://cmd.labxp.io/auth/discord/callback and
      # https://cmd-dev.labxp.io/auth/discord/callback. Mismatch is the most
      # common failure here; the callback handler deliberately surfaces
      # Discord's error code verbatim.
      #
      # Picked in shell, not with a `${{ cond && vars.A || vars.B }}` ternary,
      # for the reason on "Resolve deploy target": that form falls through on
      # an empty value, so an unset CMDCTRL_DISCORD_REDIRECT_URI would quietly
      # configure PRODUCTION with the preview's callback and send every
      # production sign-in to the dev box. Unset now warns and skips instead.
      #
      # The bot's variables (_APP_ID, _GUILD_IDS) are deliberately NOT set
      # here. The bot is a separate unit reading a separate file as a
      # separate user (EnvironmentFile=${BOT_ENV_FILE}, User=cmdctrl-bot);
      # "Sync bot env" below writes them there, on production only.
      # CMDCTRL_DISCORD_BOT_TOKEN is the one value BOTH units need -- the
      # server since S34 sub-PR 6 -- and it has its own step below rather
      # than joining this loop, because it is production-only and these
      # three are not.
      - name: Sync server env (Discord sign-in)
        env:
          CMDCTRL_DISCORD_CLIENT_ID: ${{ secrets.CMDCTRL_DISCORD_CLIENT_ID }}
          CMDCTRL_DISCORD_CLIENT_SECRET: ${{ secrets.CMDCTRL_DISCORD_CLIENT_SECRET }}
          PROD_REDIRECT_URI: ${{ vars.CMDCTRL_DISCORD_REDIRECT_URI }}
          DEV_REDIRECT_URI: ${{ vars.CMDCTRL_DEV_DISCORD_REDIRECT_URI }}
        run: |
          if [ "${IS_DEV}" = "true" ]; then
            CMDCTRL_DISCORD_REDIRECT_URI="${DEV_REDIRECT_URI}"
            redirect_var="CMDCTRL_DEV_DISCORD_REDIRECT_URI"
          else
            CMDCTRL_DISCORD_REDIRECT_URI="${PROD_REDIRECT_URI}"
            redirect_var="CMDCTRL_DISCORD_REDIRECT_URI"
          fi

          missing=0
          for KEY in CMDCTRL_DISCORD_CLIENT_ID CMDCTRL_DISCORD_CLIENT_SECRET \
                     CMDCTRL_DISCORD_REDIRECT_URI; do
            VALUE="${!KEY}"
            if [ -z "${VALUE}" ]; then
              if [ "${KEY}" = "CMDCTRL_DISCORD_REDIRECT_URI" ]; then
                echo "::warning::Repo variable ${redirect_var} is not set; skipping ${KEY}."
              else
                echo "::warning::${KEY} is not configured; skipping."
              fi
              missing=$((missing + 1))
              continue
            fi
            printf '%s' "${VALUE}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh ${KEY} ${ENV_FILE}"
            echo "set ${KEY}"
          done
          if [ "${missing}" -gt 0 ]; then
            echo "::notice::${missing} of 3 Discord sign-in values unset -- /auth/discord/start will return 503 and the client will hide the sign-in button."
          fi

      # ADR 0051 decision 5's DM invites (#613, S34 sub-PR 6): the SERVER
      # now reads the bot token too, for POST /games/{id}/invites/dm. It is
      # the same Actions secret the bot's own env file gets below, written
      # to a second place -- the two units run as different users off
      # different EnvironmentFiles, so neither can read the other's copy, and
      # rotating the secret still updates both on the next deploy.
      #
      # PRODUCTION ONLY, matching "Sync bot env": one Discord application,
      # and a preview box DMing real people from the same bot identity is
      # exactly the double-send the bot's prod-only rule exists to prevent.
      # The develop deployment therefore has no token, which is a supported
      # state -- the route answers 503 naming the variable, every other route
      # is unchanged, and the server says which it is once at boot. It never
      # fails open.
      #
      # Unset secret: skipped with a ::notice::, same as "Sync bot env", so
      # main keeps deploying green before DM invites are wanted. The value
      # travels over stdin, never ssh argv, exactly as above.
      - name: Sync server env (Discord DM invites)
        if: env.IS_DEV != 'true'
        env:
          CMDCTRL_DISCORD_BOT_TOKEN: ${{ secrets.CMDCTRL_DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "${CMDCTRL_DISCORD_BOT_TOKEN}" ]; then
            echo "::notice::CMDCTRL_DISCORD_BOT_TOKEN secret not set; POST /games/{id}/invites/dm will return 503 and every other route is unaffected."
            exit 0
          fi
          printf '%s' "${CMDCTRL_DISCORD_BOT_TOKEN}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_DISCORD_BOT_TOKEN ${ENV_FILE}"
          echo "set CMDCTRL_DISCORD_BOT_TOKEN"

      # Production only -- see "Deploy bot binary". Provisions the bot's env
      # file the way the server's is provisioned: Actions is the source of
      # truth, so rotating the bot token is "update the secret, redeploy".
      #
      # Sources: secret CMDCTRL_DISCORD_BOT_TOKEN, variables
      # CMDCTRL_DISCORD_APP_ID and CMDCTRL_DISCORD_GUILD_IDS (comma-separated
      # guild snowflakes). server/internal/bot/config.go Validate() also
      # requires CMDCTRL_ADMIN_TOKEN; that one is not an Actions value. It
      # is copied on the host from ${ENV_FILE}, where Terraform writes the
      # server's copy, on every deploy -- so a HomeLab rotation of the admin
      # token cannot leave the bot holding a stale one. The raw right-hand
      # side is copied verbatim and both files are parsed by systemd's
      # EnvironmentFile=, so they mean the same thing. The value moves over
      # a pipe on the host and never leaves it.
      #
      # CMDCTRL_SERVER_BASE_URL and CMDCTRL_CLIENT_BASE_URL are not written:
      # their defaults (http://127.0.0.1:8080, https://cmd.labxp.io) are
      # production's values.
      #
      # bot.env must be root:cmdctrl-bot 0640. set-server-env.sh preserves an
      # existing file's owner and mode but creates a missing one root:root,
      # which the cmdctrl-bot service user could not read. So this step
      # creates it with the right group and re-asserts owner and mode on
      # every run before any value is written -- which needs the cmdctrl-bot
      # group, created by the operator (deploy/README.md, "One-time host
      # setup") on the running VM and again after every rebuild, until the
      # HomeLab template creates it.
      #
      # Skips with a ::notice:: when the token secret is unset
      # (BOT_TOKEN_SET), so main keeps deploying before the bot is wanted.
      # Past that point the secret is set, so the bot is wanted, and a host
      # that cannot run it is a ::warning:: that leaves the deploy green: a
      # missing cmdctrl-bot group skips the write, and a missing
      # cmdctrl-bot user (group present) still writes bot.env. Values
      # travel over stdin, never ssh argv, exactly as in "Sync server env
      # (Discord sign-in)".
      #
      # CMDCTRL_DISCORD_BOT_TOKEN is ALSO written to ${ENV_FILE}, by "Sync
      # server env (Discord DM invites)" above: since S34 sub-PR 6 the server
      # reads it too, for ADR 0051 Decision 5's POST /games/{id}/invites/dm
      # (#613). Two files, not one shared file -- the two units run as
      # different users off different EnvironmentFiles, and the server cannot
      # read root:cmdctrl-bot 0640. Both copies come from the same secret on
      # the same deploy, so a rotation updates both.
      #
      # CMDCTRL_DISCORD_ADMIN_USER_IDS and CMDCTRL_DISCORD_ADMIN_ROLE_IDS
      # (#614) are written the same way as CMDCTRL_DISCORD_GUILD_IDS above
      # -- comma-separated snowflakes, production only -- but they are
      # OPTIONAL: unlike the four keys below, an unset admin variable is
      # not a misconfiguration to warn about. /cc-end's own refusal
      # message covers that case (server/internal/bot/config.go
      # Config.IsAdmin), so this step only writes what's set and stays
      # silent otherwise; see the loop after the required keys below.
      - name: Sync bot env
        if: env.IS_DEV != 'true'
        env:
          CMDCTRL_DISCORD_BOT_TOKEN: ${{ secrets.CMDCTRL_DISCORD_BOT_TOKEN }}
          CMDCTRL_DISCORD_APP_ID: ${{ vars.CMDCTRL_DISCORD_APP_ID }}
          CMDCTRL_DISCORD_GUILD_IDS: ${{ vars.CMDCTRL_DISCORD_GUILD_IDS }}
          CMDCTRL_DISCORD_ADMIN_USER_IDS: ${{ vars.CMDCTRL_DISCORD_ADMIN_USER_IDS }}
          CMDCTRL_DISCORD_ADMIN_ROLE_IDS: ${{ vars.CMDCTRL_DISCORD_ADMIN_ROLE_IDS }}
        run: |
          if [ "${BOT_TOKEN_SET}" != "true" ]; then
            echo "::notice::CMDCTRL_DISCORD_BOT_TOKEN secret not set; skipping bot env sync (the bot stays unconfigured)."
            exit 0
          fi

          prepared=$(ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            if ! getent group cmdctrl-bot >/dev/null; then
              echo no-group
              exit 0
            fi
            if [ ! -e ${BOT_ENV_FILE} ]; then
              sudo install -o root -g cmdctrl-bot -m 0640 /dev/null ${BOT_ENV_FILE}
            fi
            sudo chown root:cmdctrl-bot ${BOT_ENV_FILE}
            sudo chmod 0640 ${BOT_ENV_FILE}
            if getent passwd cmdctrl-bot >/dev/null; then
              echo ready
            else
              echo ready-no-user
            fi
          ")
          case "${prepared}" in
            no-group)
              echo "::warning title=Discord bot not provisioned::CMDCTRL_DISCORD_BOT_TOKEN is set, but the cmdctrl-bot group does not exist on ${CMDCTRL_HOST}, so ${BOT_ENV_FILE} was not written and the bot cannot run. Do the one-time host setup in deploy/README.md (\"One-time host setup\"; a rebuilt host needs it again), then push a new main deploy."
              exit 0
              ;;
            ready) ;;
            ready-no-user)
              echo "::warning title=Discord bot not provisioned::CMDCTRL_DISCORD_BOT_TOKEN is set, but the cmdctrl-bot user does not exist on ${CMDCTRL_HOST} (its group does), so cmd-and-ctrl-bot.service cannot start. ${BOT_ENV_FILE} is still written. Do the one-time host setup in deploy/README.md (\"One-time host setup\"; a rebuilt host needs it again)."
              ;;
            *)
              echo "::error::Could not prepare ${BOT_ENV_FILE} on ${CMDCTRL_HOST} (got: ${prepared})."
              exit 1
              ;;
          esac

          missing=0
          for KEY in CMDCTRL_DISCORD_BOT_TOKEN CMDCTRL_DISCORD_APP_ID \
                     CMDCTRL_DISCORD_GUILD_IDS; do
            VALUE="${!KEY}"
            if [ -z "${VALUE}" ]; then
              echo "::warning::${KEY} is not configured; skipping."
              missing=$((missing + 1))
              continue
            fi
            printf '%s' "${VALUE}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh ${KEY} ${BOT_ENV_FILE}"
            echo "set ${KEY}"
          done

          # CMDCTRL_DISCORD_ADMIN_USER_IDS / _ROLE_IDS (#614) are optional --
          # unset is a valid, supported state (/cc-end then refuses every
          # caller with its own ephemeral message; it never fails open) --
          # so this loop writes whichever are set and says nothing for the
          # ones that aren't. It does not add to `missing`: that counter
          # feeds the "bot will refuse to start" notice below, and the bot
          # starts fine with no configured admins.
          for KEY in CMDCTRL_DISCORD_ADMIN_USER_IDS CMDCTRL_DISCORD_ADMIN_ROLE_IDS; do
            VALUE="${!KEY}"
            if [ -z "${VALUE}" ]; then
              continue
            fi
            printf '%s' "${VALUE}" | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh ${KEY} ${BOT_ENV_FILE}"
            echo "set ${KEY}"
          done

          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            if sudo grep -q '^CMDCTRL_ADMIN_TOKEN=.' ${ENV_FILE}; then
              sudo sed -n 's/^CMDCTRL_ADMIN_TOKEN=//p' ${ENV_FILE} | tail -n 1 \
                | sudo ${DEPLOY_ROOT}/scripts/set-server-env.sh CMDCTRL_ADMIN_TOKEN ${BOT_ENV_FILE}
              echo 'set CMDCTRL_ADMIN_TOKEN (copied from ${ENV_FILE})'
            else
              echo '::warning::CMDCTRL_ADMIN_TOKEN is missing from ${ENV_FILE}; not copied into ${BOT_ENV_FILE}.'
              exit 3
            fi
          " || {
            rc=$?
            if [ "${rc}" -eq 3 ]; then
              missing=$((missing + 1))
            else
              exit "${rc}"
            fi
          }

          if [ "${missing}" -gt 0 ]; then
            echo "::notice::${missing} of 4 required bot values unset -- the bot will refuse to start (bot config invalid) until they are."
          fi

      - name: Restart game server service
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "sudo systemctl restart ${SERVICE}"

      - name: Restart cmd-and-ctrl-bot service (if enabled)
        # Production only — see "Deploy bot binary" above.
        if: env.IS_DEV != 'true'
        # Conditional so CD keeps passing before the operator enables
        # the unit for the first time ("Install bot systemd unit"
        # installs it but never enables it). Once the unit is enabled,
        # this branch is the steady state.
        #
        # Never fails the deploy over the bot's state; only an ssh
        # failure does. A unit that is not enabled, or not active 4 s
        # after its restart, is a ::notice:: while the token secret is
        # unset and a ::warning:: once it is set (BOT_TOKEN_SET).
        #
        # Why wait 4 s: `is-active` right after a restart only proves the
        # process forked (Type=simple), so a bot that exits at once (on
        # "bot config invalid", or a missing cmdctrl-bot user) would
        # still print active. With RestartSec=5 such a bot is still
        # "activating" (waiting to be restarted) 4 s later. A bot that
        # fails after that is not caught here; the real check is
        # journalctl ("discord session ready") and NRestarts -- see
        # deploy/README.md.
        run: |
          state=$(ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            if ! systemctl is-enabled cmd-and-ctrl-bot >/dev/null 2>&1; then
              echo not-enabled
              exit 0
            fi
            if ! sudo systemctl restart cmd-and-ctrl-bot >&2; then
              echo restart-failed
              exit 0
            fi
            sleep 4
            systemctl is-active cmd-and-ctrl-bot || true
          ')

          case "${state}" in
            active)
              echo "cmd-and-ctrl-bot restarted; still active 4 s later."
              ;;
            not-enabled)
              if [ "${BOT_TOKEN_SET}" = "true" ]; then
                echo "::warning title=Discord bot not running::CMDCTRL_DISCORD_BOT_TOKEN is set, but cmd-and-ctrl-bot is not enabled on ${CMDCTRL_HOST}, so the bot was not restarted and is not running. Do the one-time host setup in deploy/README.md (\"One-time host setup\"; a rebuilt host needs it again)."
              else
                echo "::notice::cmd-and-ctrl-bot is not enabled; skipping bot restart. Enabling it is an operator step, needed again after every rebuild of production -- see deploy/README.md."
              fi
              ;;
            *)
              if [ "${BOT_TOKEN_SET}" = "true" ]; then
                echo "::warning title=Discord bot not running::CMDCTRL_DISCORD_BOT_TOKEN is set, but cmd-and-ctrl-bot is not active on ${CMDCTRL_HOST} 4 s after its restart (state: ${state:-unknown}). Check journalctl -u cmd-and-ctrl-bot (\"bot config invalid\" names the missing key) and the one-time host setup in deploy/README.md (\"One-time host setup\")."
              else
                echo "::notice::cmd-and-ctrl-bot is not active 4 s after its restart (state: ${state:-unknown}); CMDCTRL_DISCORD_BOT_TOKEN is not set, so the bot is not expected to run."
              fi
              ;;
          esac

      - name: Verify service is active
        run: |
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "systemctl is-active ${SERVICE} && systemctl status ${SERVICE} --no-pager --lines=10"

      # Prove the deployment is answering as the environment we just
      # told it to be. Catches the failure this whole scheme exists to
      # prevent: a develop deploy that comes up believing it is prod,
      # or — far worse — a main deploy that comes up as dev with card
      # spawning enabled on the live table.
      #
      # Queried over loopback on the host so it tests the service
      # itself, not the reverse proxy or DNS. With two boxes identical
      # below the fqdn, "the service is active" is not a useful line in
      # a log that doesn't say which box, so this one names the host.
      - name: Verify reported environment
        run: |
          # systemd reports active the moment the process forks, but the
          # server does not bind until it has loaded the Scryfall dump and
          # built the card index -- comfortably longer than the 10s the
          # original --retry 5 allowed, so every deploy failed here while
          # the deployment itself was fine. 30 retries at 2s covers a cold
          # start with headroom and still gives up well inside the job.
          if ! body=$(ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
            "curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --max-time 120 http://127.0.0.1:${LOCAL_PORT}/config"); then
            echo "::error::${SERVICE} on ${CMDCTRL_HOST} never answered GET /config on port ${LOCAL_PORT}. The unit is active but not listening -- check 'journalctl -u ${SERVICE}' on that host."
            exit 1
          fi
          echo "GET /config on ${CMDCTRL_HOST} -> ${body}"
          case "${body}" in
            *'"env":"'"${APP_ENV}"'"'*) ;;
            *)
              echo "::error::${SERVICE} on ${CMDCTRL_HOST} answered, but did not report env=${APP_ENV}. Check CMDCTRL_ENV in ${ENV_FILE} on that host."
              exit 1
              ;;
          esac
          echo "Confirmed: ${CMDCTRL_HOST} is running ${SERVICE} as ${APP_ENV}."

      # Nightly off-node backup of the data dir to Cloudflare R2 with
      # restic (#1031, ADR 0051 decision 1). Runs on BOTH hosts, each into
      # its own bucket. Runbook: docs/environments.md#backups.
      #
      # Last on purpose: the game is already deployed and verified above,
      # so nothing here can leave a half-deployed server. A real failure
      # (ssh, apt, install) still fails the run, because a backup that
      # silently stopped being installed is the failure this exists to
      # prevent. A MISSING secret or variable does not fail it: each one is
      # named in a ::warning:: and the timer is stopped and disabled, so an
      # unconfigured host deploys green and does not fail every night.
      #
      # Per-host values live in the job's GitHub environment (`prod` or
      # `dev`, see the job's `environment:`), under the same four names in
      # each: variable CMDCTRL_R2_REPOSITORY, secrets CMDCTRL_R2_ACCESS_KEY_ID,
      # CMDCTRL_R2_SECRET_ACCESS_KEY and CMDCTRL_RESTIC_PASSWORD. A value
      # that still contains REPLACE_ME is a placeholder and counts as unset,
      # so a half-filled environment never enables the timer -- and, above
      # all, never initialises a repository under a placeholder password.
      #
      # Secrets travel to the host on ssh STDIN only: the env file is built
      # with printf (a bash builtin, so no argv on the runner either) and
      # piped into `sudo tee` on a root-only temp file, then chowned and
      # renamed into place. They never appear on a command line, in `ps`,
      # or in this log (Actions masks them regardless).
      #
      # backup.env is rewritten on every deploy: the Actions secrets are
      # the source of truth. The ONE value that must never change once the
      # repository exists is the restic password -- restic cannot open a
      # repository with a different one, so changing the secret makes every
      # later backup fail ("wrong password or no key found"). It is also
      # stored in the owner's password manager, which is the recovery path:
      # GitHub secrets are write-only.
      - name: Ensure off-site backup
        env:
          RESTIC_REPOSITORY: ${{ vars.CMDCTRL_R2_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CMDCTRL_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CMDCTRL_R2_SECRET_ACCESS_KEY }}
          RESTIC_PASSWORD: ${{ secrets.CMDCTRL_RESTIC_PASSWORD }}
          BACKUP_ENV_FILE: /etc/cmd_and_ctrl/backup.env
          BACKUP_UNIT: cmd-and-ctrl-backup
        run: |
          # Where each value lives, for the messages below.
          where="GitHub environment '${APP_ENV}'"

          # 1. Units. Installed whether or not backups are configured, so
          # a host is one secret away from backing up; installed and
          # daemon-reloaded only when content, owner or mode changed (the
          # "Install bot systemd unit" pattern). The script itself came
          # with "Deploy scripts".
          rsync -a -e "ssh ${SSH_OPTS}" \
            deploy/${BACKUP_UNIT}.service deploy/${BACKUP_UNIT}.timer \
            krkn@${CMDCTRL_HOST}:/tmp/
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            changed=0
            for u in ${BACKUP_UNIT}.service ${BACKUP_UNIT}.timer; do
              new=/tmp/\$u; dst=/etc/systemd/system/\$u
              if [ -f \"\$dst\" ] && cmp -s \"\$new\" \"\$dst\" \
                 && [ \"\$(stat -c '%U:%G %a' \"\$dst\")\" = 'root:root 644' ]; then
                echo \"\$u unchanged.\"
              else
                sudo install -o root -g root -m 0644 \"\$new\" \"\$dst\"
                echo \"\$u installed.\"
                changed=1
              fi
              rm -f \"\$new\"
            done
            if [ \"\$changed\" = 1 ]; then sudo systemctl daemon-reload; echo 'daemon reloaded.'; fi
          "

          # 2. Configured? Name every missing or placeholder value, then
          # stand down.
          missing=()
          unset_or_placeholder() {
            [ -z "$1" ] || case "$1" in *REPLACE_ME*) true ;; *) false ;; esac
          }
          unset_or_placeholder "${RESTIC_REPOSITORY}" && missing+=("variable CMDCTRL_R2_REPOSITORY")
          unset_or_placeholder "${AWS_ACCESS_KEY_ID}" && missing+=("secret CMDCTRL_R2_ACCESS_KEY_ID")
          unset_or_placeholder "${AWS_SECRET_ACCESS_KEY}" && missing+=("secret CMDCTRL_R2_SECRET_ACCESS_KEY")
          unset_or_placeholder "${RESTIC_PASSWORD}" && missing+=("secret CMDCTRL_RESTIC_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::warning title=Off-site backup not configured::${m} in ${where} is unset or still a REPLACE_ME placeholder, so ${CMDCTRL_HOST} (${APP_ENV}) has NO off-site backup. See docs/environments.md#backups."
            done
            ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} \
              "sudo systemctl disable --now ${BACKUP_UNIT}.timer 2>/dev/null || true"
            echo "${BACKUP_UNIT}.timer stopped and disabled until all four values are set."
            exit 0
          fi

          # systemd EnvironmentFile= and a bash `.` both read a
          # single-quoted value literally, so quote every value and refuse
          # the two characters that would break out of that.
          for KEY in RESTIC_REPOSITORY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY RESTIC_PASSWORD; do
            VALUE="${!KEY}"
            case "${VALUE}" in
              *"'"*|*$'\n'*)
                echo "::error::${KEY} for ${APP_ENV} contains a single quote or a newline, which ${BACKUP_ENV_FILE} cannot carry. Regenerate it without (for the restic password only BEFORE the repository is first initialised -- see docs/environments.md#backups)."
                exit 1
                ;;
            esac
          done
          case "${RESTIC_REPOSITORY}" in
            s3:https://*.r2.cloudflarestorage.com/*) ;;
            *) echo "::warning::CMDCTRL_R2_REPOSITORY in ${where} does not look like s3:https://<account_id>.r2.cloudflarestorage.com/<bucket>; using it as given." ;;
          esac

          # 3. restic, once. Rebuilt hosts get it from the HomeLab
          # cloud-init template (HomeLab#58); existing hosts get it here.
          ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} '
            set -eu
            if command -v restic >/dev/null 2>&1; then
              restic version
            else
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq restic
              restic version
            fi
          '

          # 4. backup.env, root:cmdctrl 0640, atomically. Values on stdin.
          {
            printf '# Written by CD ("Ensure off-site backup") on every deploy. Do not edit.\n'
            printf '# RESTIC_PASSWORD must never change once the repository is initialised.\n'
            printf "RESTIC_REPOSITORY='%s'\n" "${RESTIC_REPOSITORY}"
            printf "AWS_ACCESS_KEY_ID='%s'\n" "${AWS_ACCESS_KEY_ID}"
            printf "AWS_SECRET_ACCESS_KEY='%s'\n" "${AWS_SECRET_ACCESS_KEY}"
            printf "AWS_DEFAULT_REGION='auto'\n"
            printf "RESTIC_PASSWORD='%s'\n" "${RESTIC_PASSWORD}"
            printf "CMDCTRL_BACKUP_ENV='%s'\n" "${APP_ENV}"
          } | ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            tmp=\$(sudo mktemp ${BACKUP_ENV_FILE}.XXXXXX)
            trap 'sudo rm -f \"\$tmp\"' EXIT
            sudo tee \"\$tmp\" >/dev/null
            sudo chown root:cmdctrl \"\$tmp\"
            sudo chmod 0640 \"\$tmp\"
            sudo mv \"\$tmp\" ${BACKUP_ENV_FILE}
            trap - EXIT
            echo 'wrote ${BACKUP_ENV_FILE} (root:cmdctrl 0640)'
          "

          # 5. Timer on. Report the next run, and warn (not fail) if the
          # last run failed -- that is the only place a broken nightly
          # backup surfaces without someone reading the journal.
          last=$(ssh ${SSH_OPTS} krkn@${CMDCTRL_HOST} "
            set -eu
            sudo systemctl enable --now ${BACKUP_UNIT}.timer >&2
            systemctl list-timers ${BACKUP_UNIT}.timer --no-pager >&2
            systemctl show -p Result --value ${BACKUP_UNIT}.service
          ")
          case "${last}" in
            success|'') echo "${BACKUP_UNIT}.timer enabled; last run: ${last:-never}." ;;
            *) echo "::warning title=Off-site backup failing::The last ${BACKUP_UNIT} run on ${CMDCTRL_HOST} ended with '${last}'. Check journalctl -u ${BACKUP_UNIT} on that host (docs/environments.md#backups)." ;;
          esac
