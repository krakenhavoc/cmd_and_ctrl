<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the installed app draw under the notch and
         home indicator; app.css pays the safe-area insets back in
         standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CMD &amp; CTRL</title>
    <meta name="description" content="The Commander table, over the wire." />
    <!-- Site ownership check for the TCGplayer shop links' affiliate
         network (ADR 0179). Impact reads `value`, not `content`. -->
    <meta name="impact-site-verification" value="8794f059-ec67-483e-bd48-f3db6ba3036c" />

    <!-- PWA (ADR 0031). theme_color matches the default skin's --bg; App.svelte
         updates it to the chosen skin's --bg once settings load, so this is
         the first-paint value, not prefers-color-scheme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070d14" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS ignores the manifest: display mode, status bar and app name all
         come from these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CMD &amp; CTRL" />

    <!-- Fonts are self-hosted (public/fonts, SIL OFL; @font-face in src/app.css).
         Preload the two faces the front page paints first. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
