<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="CMD &amp; CTRL">
  <!-- Tab-sized variant of icon.svg: the mark fills more of the tile so
       both cards still read at 16px. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="white" />
      <rect x="19" y="26" width="42" height="32" rx="8" fill="black" />
    </mask>
  </defs>
  <rect width="64" height="64" rx="12" fill="#070d14" />
  <g transform="translate(3.2 3.2) scale(0.9)">
    <rect x="7" y="10" width="26" height="36" rx="5" fill="#e8eff7" mask="url(#cut)" />
    <rect x="23" y="30" width="34" height="24" rx="5" fill="#ff7a1a" />
  </g>
</svg>
