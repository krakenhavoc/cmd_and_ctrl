<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CMD &amp; CTRL">
  <title>CMD &amp; CTRL</title>
  <desc>
    purpose=maskable: full bleed ink, and the mark stays inside the 40 percent
    radius safe circle (half diagonal 181px plus 7px stroke = 188px, against a
    205px safe radius) so no launcher mask can clip it.
  </desc>
  <defs>
    <radialGradient id="pool" cx="50%" cy="4%" r="78%">
      <stop offset="0%" stop-color="#d9b45c" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#d9b45c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0b0a09" />
  <rect width="512" height="512" fill="url(#pool)" />
  <g transform="rotate(45 256 256)">
    <rect x="128" y="128" width="256" height="256" rx="36" fill="none" stroke="#d9b45c" stroke-width="14" />
    <rect x="224" y="224" width="64" height="64" rx="9" fill="#d9b45c" />
  </g>
</svg>
