<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d14" />
    <meta name="color-scheme" content="dark" />
    <title>CMD &amp; CTRL — offline</title>
    <style>
      /* Self-contained on purpose: the service worker serves this page
         when the network is gone, so it can reference nothing but
         itself -- no stylesheet, no webfont, no script. The palette is
         the default skin's (War room), copied from src/app.css for the
         same reason; it cannot know which skin the player picked. */
      :root {
        color-scheme: dark;
        --bg: #070d14;
        --fg: #e8eff7;
        --fg-muted: #8fa3ba;
        --fg-dim: #5d7187;
        --accent: #ff7a1a;
        --surface: #121e2c;
        --border: rgba(140, 180, 225, 0.2);
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100vh;
        padding: 2rem 1.5rem;
        padding-left: calc(1.5rem + env(safe-area-inset-left));
        padding-right: calc(1.5rem + env(safe-area-inset-right));
        background: var(--bg);
        color: var(--fg);
        font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        margin: 1.25rem 0 0.75rem;
        font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.55;
        color: var(--fg-muted);
        font-size: 0.95rem;
      }
      ul {
        margin: 1.25rem 0 1.5rem;
        padding: 0;
        list-style: none;
        color: var(--fg-muted);
        font-size: 0.85rem;
        line-height: 1.9;
      }
      button {
        background: var(--surface);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        font: inherit;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        width="72"
        height="72"
        viewBox="-104 -104 208 208"
        role="img"
        aria-label="CMD &amp; CTRL"
      >
        <defs>
          <path
            id="c"
            d="M-10-40V-80L-30-100H-52A48 48 0 0 0-100-52V-30L-80-10H-40L-33-17L-48-32H-71A7 7 0 0 1-78-39V-52A26 26 0 0 1-52-78H-39A7 7 0 0 1-32-71V-48L-17-33Z"
          />
        </defs>
        <g fill="#ff7a1a">
          <use href="#c" />
          <use href="#c" transform="scale(-1 1)" />
          <use href="#c" transform="scale(1 -1)" />
          <use href="#c" transform="scale(-1 -1)" />
          <path d="M0-38L38 0L0 38L-38 0Z" />
        </g>
      </svg>
      <p class="mono">No connection</p>
      <h1>The table needs a connection</h1>
      <p>CMD &amp; CTRL is a live multiplayer game, so there is nothing to play offline.</p>
      <ul>
        <li>Your seat is held server-side; reconnecting drops you back into the game.</li>
        <li>Nothing was lost — the client never holds authoritative game state.</li>
      </ul>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
