# Unit tests for ../cmdctrl.yml: `promtool test rules` (CI job
# monitoring-config). At least one firing and one quiet case per alert.
# CI only: the monitoring VM's sync never reads this directory.
#
# Run locally:
#   docker run --rm -v "$(pwd):/repo:ro" -w /repo --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules deploy/monitoring/rules/tests/*.yml

rule_files:
  - ../cmdctrl.yml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------ SiteDown
  - name: SiteDown, prod after 3 minutes and dev after 10
    interval: 1m
    input_series:
      # Up for two minutes, then down for good.
      - series: 'probe_success{job="blackbox", env="prod", instance="https://cmd.labxp.io/healthz"}'
        values: "1 1 0x20"
      - series: 'probe_success{job="blackbox", env="dev", instance="https://cmd-dev.labxp.io/healthz"}'
        values: "1 1 0x20"
    alert_rule_test:
      # Down for two minutes: pending, not firing.
      - eval_time: 4m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 6m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              alertname: SiteDown
              severity: critical
              job: blackbox
              env: prod
              instance: https://cmd.labxp.io/healthz
            exp_annotations:
              summary: "prod: the site is down (https://cmd.labxp.io/healthz)"
              description: "The blackbox probe of https://cmd.labxp.io/healthz has failed for 3 minutes. Players cannot reach prod."
      - eval_time: 13m
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              alertname: SiteDown
              severity: critical
              job: blackbox
              env: prod
              instance: https://cmd.labxp.io/healthz
            exp_annotations:
              summary: "prod: the site is down (https://cmd.labxp.io/healthz)"
              description: "The blackbox probe of https://cmd.labxp.io/healthz has failed for 3 minutes. Players cannot reach prod."
          - exp_labels:
              alertname: SiteDown
              severity: warning
              job: blackbox
              env: dev
              instance: https://cmd-dev.labxp.io/healthz
            exp_annotations:
              summary: "dev: the site is down (https://cmd-dev.labxp.io/healthz)"
              description: "The blackbox probe of https://cmd-dev.labxp.io/healthz has failed for 10 minutes."

  - name: SiteDown, a short blip is quiet
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox", env="prod", instance="https://cmd.labxp.io/healthz"}'
        values: "1 0 0 1x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: SiteDown
        exp_alerts: []

  # -------------------------------------------------- ServerNotReporting
  - name: ServerNotReporting, Alloy scrapes a dead server
    interval: 1m
    input_series:
      - series: 'up{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "1 1 0x10"
      - series: 'up{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "1x12"
    alert_rule_test:
      # Four minutes of 0: the window still holds a 1.
      - eval_time: 5m
        alertname: ServerNotReporting
        exp_alerts: []
      - eval_time: 8m
        alertname: ServerNotReporting
        exp_alerts:
          - exp_labels:
              alertname: ServerNotReporting
              severity: critical
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: the game server has not reported for 5 minutes on cmd-and-ctrl"
              description: "No metrics from the prod game server for 5 minutes. Either the server is down while Alloy still scrapes it (up is 0), or nothing reaches the monitor from that host at all."

  - name: ServerNotReporting, nothing arrives from dev at all
    interval: 1m
    input_series:
      - series: 'up{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "1x20"
      # Two samples, then the host goes silent.
      - series: 'up{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "1 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: ServerNotReporting
        exp_alerts: []
      - eval_time: 8m
        alertname: ServerNotReporting
        exp_alerts:
          - exp_labels:
              alertname: ServerNotReporting
              severity: warning
              job: cmdctrl-server
              env: dev
            exp_annotations:
              summary: "dev: the game server has not reported for 5 minutes"
              description: "No metrics from the dev game server for 5 minutes. Either the server is down while Alloy still scrapes it (up is 0), or nothing reaches the monitor from that host at all."

  # ----------------------------------------------------- ServerCrashLoop
  - name: ServerCrashLoop, four restarts in 15 minutes
    interval: 1m
    input_series:
      # Restarts at 2m, 4m, 6m and 8m.
      - series: 'process_start_time_seconds{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "100 100 220 220 340 340 460 460 580 580 580"
      # One deploy.
      - series: 'process_start_time_seconds{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "100x5 400x5"
    alert_rule_test:
      # Three restarts so far.
      - eval_time: 6m
        alertname: ServerCrashLoop
        exp_alerts: []
      - eval_time: 9m
        alertname: ServerCrashLoop
        exp_alerts:
          - exp_labels:
              alertname: ServerCrashLoop
              severity: critical
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: the game server on cmd-and-ctrl is crash-looping"
              description: "The prod server on cmd-and-ctrl started 4 more times in the last 15 minutes."

  - name: ServerCrashLoop, dev is a warning
    interval: 1m
    input_series:
      - series: 'process_start_time_seconds{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "1 2 3 4 5 5"
    alert_rule_test:
      - eval_time: 5m
        alertname: ServerCrashLoop
        exp_alerts:
          - exp_labels:
              alertname: ServerCrashLoop
              severity: warning
              job: cmdctrl-server
              env: dev
              host: cmd-and-ctrl-dev
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "dev: the game server on cmd-and-ctrl-dev is crash-looping"
              description: "The dev server on cmd-and-ctrl-dev started 4 more times in the last 15 minutes."

  # ------------------------------------------------------------ UnitFailed
  - name: UnitFailed, the server unit gave up; the backup unit is left to OffsiteBackupStale
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node", env="prod", host="cmd-and-ctrl", name="cmd-and-ctrl.service", state="failed"}'
        values: "0 0 1x10"
      - series: 'node_systemd_unit_state{job="node", env="prod", host="cmd-and-ctrl", name="cmd-and-ctrl.service", state="active"}'
        values: "1 1 0x10"
      - series: 'node_systemd_unit_state{job="node", env="prod", host="cmd-and-ctrl", name="cmd-and-ctrl-backup.service", state="failed"}'
        values: "1x12"
      - series: 'node_systemd_unit_state{job="node", env="prod", host="cmd-and-ctrl", name="caddy.service", state="failed"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 1m
        alertname: UnitFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: UnitFailed
        exp_alerts:
          - exp_labels:
              alertname: UnitFailed
              severity: critical
              job: node
              env: prod
              host: cmd-and-ctrl
              name: cmd-and-ctrl.service
              state: failed
            exp_annotations:
              summary: "prod: cmd-and-ctrl.service has failed on cmd-and-ctrl"
              description: "systemd gave up restarting cmd-and-ctrl.service on cmd-and-ctrl (prod). It will not start again by itself."

  - name: UnitFailed, dev waits 5 minutes
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="node", env="dev", host="cmd-and-ctrl-dev", name="cmd-and-ctrl.service", state="failed"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: UnitFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: UnitFailed
        exp_alerts:
          - exp_labels:
              alertname: UnitFailed
              severity: warning
              job: node
              env: dev
              host: cmd-and-ctrl-dev
              name: cmd-and-ctrl.service
              state: failed
            exp_annotations:
              summary: "dev: cmd-and-ctrl.service has failed on cmd-and-ctrl-dev"
              description: "systemd gave up restarting cmd-and-ctrl.service on cmd-and-ctrl-dev (dev). It will not start again by itself."

  # ------------------------------------------------- RestoreAbandonedGames
  - name: RestoreAbandonedGames, only within 15 minutes of a start
    interval: 1m
    input_series:
      # The process started at t=0 and abandoned two tables at boot.
      - series: 'cmdctrl_boot_restore_games{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", outcome="abandoned"}'
        values: "2x30"
      - series: 'cmdctrl_boot_restore_games{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", outcome="restored"}'
        values: "3x30"
      - series: 'process_start_time_seconds{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 2m
        alertname: RestoreAbandonedGames
        exp_alerts:
          - exp_labels:
              alertname: RestoreAbandonedGames
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
              outcome: abandoned
            exp_annotations:
              summary: "prod: the last restart on cmd-and-ctrl abandoned 2 game(s)"
              description: "The prod server on cmd-and-ctrl could not restore 2 table(s) from their restore points at boot. Their players lost the game."
      # Past 15 minutes it resolves, though the gauge still says 2.
      - eval_time: 20m
        alertname: RestoreAbandonedGames
        exp_alerts: []

  - name: RestoreAbandonedGames, a clean restore is quiet
    interval: 1m
    input_series:
      - series: 'cmdctrl_boot_restore_games{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", outcome="abandoned"}'
        values: "0x10"
      - series: 'process_start_time_seconds{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: RestoreAbandonedGames
        exp_alerts: []

  # --------------------------------------------------- RestorePointLagging
  - name: RestorePointLagging, a table 20 minutes behind for 10 minutes
    interval: 1m
    input_series:
      - series: 'cmdctrl_restore_point_age_seconds{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "0 300 1200x15"
    alert_rule_test:
      # Over the line for 5 minutes: still pending.
      - eval_time: 7m
        alertname: RestorePointLagging
        exp_alerts: []
      - eval_time: 13m
        alertname: RestorePointLagging
        exp_alerts:
          - exp_labels:
              alertname: RestorePointLagging
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: restore points on cmd-and-ctrl are 20m 0s behind"
              description: "The oldest restore point among active tables on cmd-and-ctrl (prod) is 20m 0s old. A deploy or crash now would rewind that table that far."

  # ---------------------------------------------------- OffsiteBackupStale
  - name: OffsiteBackupStale, no success for two days
    interval: 1h
    input_series:
      # Last success at t=0; the clock runs on for 48 hours.
      - series: 'cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x48"
      - series: 'cmdctrl_offsite_backup_last_exit_code{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x48"
    alert_rule_test:
      - eval_time: 30h
        alertname: OffsiteBackupStale
        exp_alerts: []
      - eval_time: 40h
        alertname: OffsiteBackupStale
        exp_alerts:
          - exp_labels:
              alertname: OffsiteBackupStale
              severity: warning
              cause: stale
              job: node
              env: prod
              host: cmd-and-ctrl
            exp_annotations:
              summary: "prod: no off-site backup from cmd-and-ctrl for 1d 16h 0m 0s"
              description: "The nightly off-site backup on cmd-and-ctrl (prod) last succeeded 1d 16h 0m 0s ago."

  # ------------------------------------------------- RestoreRehearsalStale
  - name: RestoreRehearsalStale, no pass for 36 days
    interval: 1d
    input_series:
      - series: 'cmdctrl_restore_rehearsal_last_success_timestamp_seconds{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x40"
      - series: 'cmdctrl_restore_rehearsal_last_exit_code{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 30d
        alertname: RestoreRehearsalStale
        exp_alerts: []
      - eval_time: 36d
        alertname: RestoreRehearsalStale
        exp_alerts:
          - exp_labels:
              alertname: RestoreRehearsalStale
              severity: warning
              cause: stale
              job: node
              env: prod
              host: cmd-and-ctrl
            exp_annotations:
              summary: "prod: no restore rehearsal on cmd-and-ctrl for 36d 0h 0m 0s"
              description: "The monthly restore rehearsal on cmd-and-ctrl (prod) last passed 36d 0h 0m 0s ago. An untested backup is not a backup: docs/environments.md#restore-rehearsal."

  - name: RestoreRehearsalStale, the last rehearsal failed
    interval: 1h
    input_series:
      - series: 'cmdctrl_restore_rehearsal_last_success_timestamp_seconds{job="node", env="dev", host="cmd-and-ctrl-dev"}'
        values: "0x4"
      - series: 'cmdctrl_restore_rehearsal_last_exit_code{job="node", env="dev", host="cmd-and-ctrl-dev"}'
        values: "0 0 1 1 1"
    alert_rule_test:
      - eval_time: 1h
        alertname: RestoreRehearsalStale
        exp_alerts: []
      - eval_time: 3h
        alertname: RestoreRehearsalStale
        exp_alerts:
          - exp_labels:
              alertname: RestoreRehearsalStale
              severity: warning
              cause: failed
              job: node
              env: dev
              host: cmd-and-ctrl-dev
            exp_annotations:
              summary: "dev: the last restore rehearsal on cmd-and-ctrl-dev failed (exit 1)"
              description: "scripts/restore-rehearsal.sh on cmd-and-ctrl-dev (dev) exited 1. journalctl -u cmd-and-ctrl-restore-rehearsal says why; the latest backup may not restore."

  - name: OffsiteBackupStale, the last run failed
    interval: 1h
    input_series:
      - series: 'cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node", env="dev", host="cmd-and-ctrl-dev"}'
        values: "0x4"
      - series: 'cmdctrl_offsite_backup_last_exit_code{job="node", env="dev", host="cmd-and-ctrl-dev"}'
        values: "0 0 3 3 3"
      # Prod is reporting and healthy, so the missing-series rule is quiet.
      - series: 'cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x4"
      - series: 'cmdctrl_offsite_backup_last_exit_code{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0x4"
    alert_rule_test:
      - eval_time: 1h
        alertname: OffsiteBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: OffsiteBackupStale
        exp_alerts:
          - exp_labels:
              alertname: OffsiteBackupStale
              severity: warning
              cause: failed
              job: node
              env: dev
              host: cmd-and-ctrl-dev
            exp_annotations:
              summary: "dev: the last off-site backup on cmd-and-ctrl-dev failed (exit 3)"
              description: "scripts/backup-offsite.sh on cmd-and-ctrl-dev (dev) exited 3 on its last run. journalctl -u cmd-and-ctrl-backup says why."

  # ----------------------------------------------------------- DiskFilling
  - name: DiskFilling, a real disk under 15% for 15 minutes; tmpfs ignored
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node", env="prod", host="cmd-and-ctrl", mountpoint="/", device="/dev/sda1", fstype="ext4"}'
        values: "50 10x30"
      - series: 'node_filesystem_size_bytes{job="node", env="prod", host="cmd-and-ctrl", mountpoint="/", device="/dev/sda1", fstype="ext4"}'
        values: "100x30"
      # A full tmpfs is not a disk.
      - series: 'node_filesystem_avail_bytes{job="node", env="prod", host="cmd-and-ctrl", mountpoint="/run", device="tmpfs", fstype="tmpfs"}'
        values: "0x30"
      - series: 'node_filesystem_size_bytes{job="node", env="prod", host="cmd-and-ctrl", mountpoint="/run", device="tmpfs", fstype="tmpfs"}'
        values: "100x30"
      # A healthy data disk.
      - series: 'node_filesystem_avail_bytes{job="node", env="monitoring", host="cmd-and-ctrl-monitoring", mountpoint="/data", device="/dev/sdb1", fstype="ext4"}'
        values: "60x30"
      - series: 'node_filesystem_size_bytes{job="node", env="monitoring", host="cmd-and-ctrl-monitoring", mountpoint="/data", device="/dev/sdb1", fstype="ext4"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: DiskFilling
        exp_alerts: []
      - eval_time: 20m
        alertname: DiskFilling
        exp_alerts:
          - exp_labels:
              alertname: DiskFilling
              severity: warning
              job: node
              env: prod
              host: cmd-and-ctrl
              mountpoint: /
              device: /dev/sda1
              fstype: ext4
            exp_annotations:
              summary: "prod: / on cmd-and-ctrl is 10% free"
              description: "/ (/dev/sda1) on cmd-and-ctrl (prod) has had under 15% free for 15 minutes."

  # ------------------------------------------- MonitoringConfigSyncFailing
  - name: MonitoringConfigSyncFailing, no good sync for over an hour
    interval: 10m
    input_series:
      # Synced at t=0 and t=10m, then every run fails.
      - series: 'cmdctrl_monitoring_sync_last_success_timestamp_seconds{job="node", env="monitoring", host="cmd-and-ctrl-monitoring"}'
        values: "0 600x12"
    alert_rule_test:
      - eval_time: 60m
        alertname: MonitoringConfigSyncFailing
        exp_alerts: []
      - eval_time: 90m
        alertname: MonitoringConfigSyncFailing
        exp_alerts:
          - exp_labels:
              alertname: MonitoringConfigSyncFailing
              severity: warning
              job: node
              env: monitoring
              host: cmd-and-ctrl-monitoring
            exp_annotations:
              summary: "monitoring: the monitoring config sync on cmd-and-ctrl-monitoring has not succeeded for 1h 20m 0s"
              description: "The monitoring VM (cmd-and-ctrl-monitoring) has not applied deploy/monitoring/ from main for 1h 20m 0s. Its rules and dashboards are the last good copy."

  # ------------------------------------------------------------ CapacityHigh
  - name: CapacityHigh, a resource over 80% of its cap for 10 minutes; a cap that is off is ignored
    interval: 1m
    input_series:
      # Climbs past 80% at minute 5 and stays: 10 minutes later it fires.
      - series: 'cmdctrl_capacity_used{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", resource="table_load"}'
        values: "10 20 40 60 70 150x30"
      - series: 'cmdctrl_capacity_limit{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", resource="table_load"}'
        values: "180x35"
      # Busy, but under the line.
      - series: 'cmdctrl_capacity_used{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", resource="ws_connections"}'
        values: "300x35"
      - series: 'cmdctrl_capacity_limit{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", resource="ws_connections"}'
        values: "400x35"
      # Dev with its caps off (limit 0): used > 0 must not divide to +Inf.
      - series: 'cmdctrl_capacity_used{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", resource="table_load"}'
        values: "50x35"
      - series: 'cmdctrl_capacity_limit{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", resource="table_load"}'
        values: "0x35"
      - series: 'cmdctrl_capacity_used{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", resource="ws_connections"}'
        values: "0x35"
      - series: 'cmdctrl_capacity_limit{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", resource="ws_connections"}'
        values: "0x35"
    alert_rule_test:
      # Under 80% for the first five minutes, then pending for ten.
      - eval_time: 4m
        alertname: CapacityHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: CapacityHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: CapacityHigh
        exp_alerts:
          - exp_labels:
              alertname: CapacityHigh
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
              resource: table_load
            exp_annotations:
              summary: "prod: table_load on cmd-and-ctrl is at 83.33% of its cap"
              description: "table_load on cmd-and-ctrl (prod) has been over 80% of its capacity cap for 10 minutes (now 83.33%). At 100% new tables, bot seats or newcomers are turned away. The 80% and 10 minutes are a first guess (ADR 0148), not a measured threshold."

  # ------------------------------------------------------ RestoreDeferredGames
  - name: RestoreDeferredGames, tables left on disk by the load cap; quiet at zero and once they are restored
    interval: 1m
    input_series:
      # Two tables deferred at boot, then the hot-restore route brings
      # them back at minute 10 and the gauge drops to 0.
      - series: 'cmdctrl_boot_restore_deferred_games{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "2x9 0x20"
      # A dev boot where everything fit.
      - series: 'cmdctrl_boot_restore_deferred_games{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: RestoreDeferredGames
        exp_alerts:
          - exp_labels:
              alertname: RestoreDeferredGames
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: 2 table(s) on cmd-and-ctrl are waiting on disk, not restored"
              description: "2 table(s) on cmd-and-ctrl (prod) were not restored at the last boot because the table-load cap was full. Their players see \"game not found\". Free load and POST /admin/capacity/restore-deferred, or restart with a raised cap."
      - eval_time: 15m
        alertname: RestoreDeferredGames
        exp_alerts: []

  # --------------------------------------------------------- PlayerReportFiled
  - name: PlayerReportFiled, any new stored report within 15 minutes on prod; dev is ignored
    interval: 1m
    input_series:
      # No report for ten minutes, one at minute 10, none after.
      - series: 'cmdctrl_player_reports_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "0x9 1x50"
      # A dev tester files one too.
      - series: 'cmdctrl_player_reports_total{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "0x9 1x50"
    alert_rule_test:
      - eval_time: 8m
        alertname: PlayerReportFiled
        exp_alerts: []
      - eval_time: 12m
        alertname: PlayerReportFiled
        exp_alerts:
          - exp_labels:
              alertname: PlayerReportFiled
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: a player report was filed"
              description: "prod stored a new player report in the last 15 minutes. Open the Reports tab in the admin views to read it (ADR 0075 section 2.6). The window is a first guess; the alert says only that a report exists, never who or why."
      # Resolved once the window has moved past it.
      - eval_time: 40m
        alertname: PlayerReportFiled
        exp_alerts: []

  # ------------------------------------------------------------ HighErrorRate
  - name: HighErrorRate, over 5% 5xx for 5 minutes on prod, with enough traffic to mean it
    interval: 1m
    input_series:
      # 90 good and 10 bad requests a minute: 10% errors.
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /games", method="GET", code="2xx"}'
        values: "0+90x40"
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /games", method="GET", code="5xx"}'
        values: "0+10x40"
      # A quiet host: one failed request out of one is 100% but not traffic.
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl-b", instance="127.0.0.1:9464", route="GET /games", method="GET", code="2xx"}'
        values: "0x40"
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl-b", instance="127.0.0.1:9464", route="GET /games", method="GET", code="5xx"}'
        values: "0 1x39"
      # Dev failing as badly: ignored.
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="GET /games", method="GET", code="2xx"}'
        values: "0+10x40"
      - series: 'cmdctrl_http_requests_total{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="GET /games", method="GET", code="5xx"}'
        values: "0+90x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 12m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              alertname: HighErrorRate
              severity: critical
              env: prod
              host: cmd-and-ctrl
            exp_annotations:
              summary: "prod: 10% of requests on cmd-and-ctrl are failing (5xx)"
              description: "More than 5% of HTTP requests to the prod server on cmd-and-ctrl have been answered 5xx for 5 minutes (now 10%). The 5% is a first guess."

  # ------------------------------------------------------------ HighLatency
  - name: HighLatency, a busy route with a p95 over 2 seconds for 10 minutes; fast and quiet routes are ignored
    interval: 1m
    input_series:
      # POST /games: every request lands in the 2.5 to 5 s bucket, 10 a minute.
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games", le="1"}'
        values: "0x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games", le="2.5"}'
        values: "0x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games", le="5"}'
        values: "0+10x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games", le="+Inf"}'
        values: "0+10x50"
      - series: 'cmdctrl_http_request_seconds_count{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games"}'
        values: "0+10x50"
      # GET /cards/{name}: 100 a minute, all under 100 ms.
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /cards/{name}", le="0.1"}'
        values: "0+100x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /cards/{name}", le="+Inf"}'
        values: "0+100x50"
      - series: 'cmdctrl_http_request_seconds_count{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /cards/{name}"}'
        values: "0+100x50"
      # A slow route nobody uses: one request a minute, under the floor.
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /replays/{id}", le="2.5"}'
        values: "0x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /replays/{id}", le="+Inf"}'
        values: "0+1x50"
      - series: 'cmdctrl_http_request_seconds_count{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="GET /replays/{id}"}'
        values: "0+1x50"
      # Dev is as slow as POST /games: ignored.
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="POST /games", le="2.5"}'
        values: "0x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="POST /games", le="5"}'
        values: "0+10x50"
      - series: 'cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="POST /games", le="+Inf"}'
        values: "0+10x50"
      - series: 'cmdctrl_http_request_seconds_count{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="POST /games"}'
        values: "0+10x50"
    alert_rule_test:
      - eval_time: 8m
        alertname: HighLatency
        exp_alerts: []
      - eval_time: 20m
        alertname: HighLatency
        exp_alerts:
          - exp_labels:
              alertname: HighLatency
              severity: warning
              env: prod
              host: cmd-and-ctrl
              route: "POST /games"
            exp_annotations:
              summary: "prod: POST /games on cmd-and-ctrl is slow (p95 4.875s)"
              description: "The 95th-percentile time to serve POST /games on cmd-and-ctrl (prod) has been over 2 seconds for 10 minutes (now 4.875s). The 2 s is a first guess."

  # ------------------------------------------------------------ RateLimitSpike
  - name: RateLimitSpike, over 100 429s in 5 minutes for 5 minutes on prod
    interval: 1m
    input_series:
      # 50 a minute from minute 0: 250 per 5 minutes.
      - series: 'cmdctrl_http_rate_limited_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", route="POST /games"}'
        values: "0+50x40"
      # A trickle on another host.
      - series: 'cmdctrl_http_rate_limited_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl-b", instance="127.0.0.1:9464", route="POST /games"}'
        values: "0+2x40"
      - series: 'cmdctrl_http_rate_limited_total{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", route="POST /games"}'
        values: "0+50x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: RateLimitSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: RateLimitSpike
        exp_alerts:
          - exp_labels:
              alertname: RateLimitSpike
              severity: warning
              env: prod
              host: cmd-and-ctrl
            exp_annotations:
              summary: "prod: 250 requests on cmd-and-ctrl were rate limited (429) in 5 minutes"
              description: "The prod server on cmd-and-ctrl answered over 100 requests 429 in 5 minutes, for 5 minutes running. Either one client is hammering a route, or a limiter is too tight for real players. cmdctrl_http_rate_limited_total by route says which. The 100 is a first guess."

  # ------------------------------------------------------------ AuthFailures
  - name: AuthFailures, three or more failed sign-ins in 10 minutes on prod; one is quiet
    interval: 1m
    input_series:
      - series: 'cmdctrl_auth_failures_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", reason="gate_check"}'
        values: "0x5 5x40"
      - series: 'cmdctrl_auth_failures_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", reason="oauth_exchange"}'
        values: "0x5 1x40"
      - series: 'cmdctrl_auth_failures_total{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464", reason="gate_check"}'
        values: "0x5 5x40"
    alert_rule_test:
      - eval_time: 4m
        alertname: AuthFailures
        exp_alerts: []
      - eval_time: 8m
        alertname: AuthFailures
        exp_alerts:
          - exp_labels:
              alertname: AuthFailures
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
              reason: gate_check
            exp_annotations:
              summary: "prod: Discord sign-in is failing on cmd-and-ctrl (gate_check)"
              description: "5 sign-ins failed with reason gate_check on cmd-and-ctrl (prod) in the last 10 minutes. oauth_exchange and oauth_profile: Discord or the client secret. gate_check: Discord did not answer the role check, so sign-in fails closed. signin_record: the database. The 3-in-10-minutes is a first guess."
      # Resolved once the burst is out of the window.
      - eval_time: 30m
        alertname: AuthFailures
        exp_alerts: []

  # ------------------------------------------------------------ BotModelSpendHigh
  - name: BotModelSpendHigh, a token cap over 80% used for 5 minutes; a cap that is off is ignored
    interval: 1m
    input_series:
      - series: 'cmdctrl_bot_budget_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="day"}'
        values: "0 500 700 900x40"
      - series: 'cmdctrl_bot_budget_limit_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="day"}'
        values: "1000x43"
      # Plenty of month left.
      - series: 'cmdctrl_bot_budget_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="month"}'
        values: "1000x43"
      - series: 'cmdctrl_bot_budget_limit_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="month"}'
        values: "10000x43"
    alert_rule_test:
      - eval_time: 6m
        alertname: BotModelSpendHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: BotModelSpendHigh
        exp_alerts:
          - exp_labels:
              alertname: BotModelSpendHigh
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
              period: day
            exp_annotations:
              summary: "prod: hosted-model spend is at 90% of the day cap"
              description: "The prod bots have used 90% of this day's token cap. At 100% the model tiers stop and the bots play the heuristic. The 80% is a first guess."

  - name: BotModelSpendHigh, no cap at all (limit 0) never fires
    interval: 1m
    input_series:
      - series: 'cmdctrl_bot_budget_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="day"}'
        values: "5000000x30"
      - series: 'cmdctrl_bot_budget_limit_tokens{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", period="day"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: BotModelSpendHigh
        exp_alerts: []

  # ------------------------------------------------------------ BotModelBlocked
  - name: BotModelBlocked, model calls refused for 15 minutes on prod
    interval: 1m
    input_series:
      - series: 'cmdctrl_bot_budget_blocked{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "0x10 1x40"
      - series: 'cmdctrl_bot_budget_blocked{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "1x50"
    alert_rule_test:
      - eval_time: 20m
        alertname: BotModelBlocked
        exp_alerts: []
      - eval_time: 30m
        alertname: BotModelBlocked
        exp_alerts:
          - exp_labels:
              alertname: BotModelBlocked
              severity: warning
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: hosted-model calls have been refused for 15 minutes"
              description: "The prod spend guard is refusing model calls: a daily or monthly token cap is reached, or the kill switch is off. Model-backed bots play the heuristic meanwhile. GET /admin/bot/model says which."

  # ------------------------------------------------------------ BotSeatWedged
  - name: BotSeatWedged, a bot seat owing a move over 2 minutes; prod after 1 minute, dev after 5
    interval: 1m
    input_series:
      # Healthy for two minutes, then owed for good.
      - series: 'cmdctrl_bot_seat_owed_seconds_max{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464"}'
        values: "0 0 200x40"
      - series: 'cmdctrl_bot_seat_owed_seconds_max{job="cmdctrl-server", env="dev", host="cmd-and-ctrl-dev", instance="127.0.0.1:9464"}'
        values: "0 0 200x40"
      # Slow but under two minutes.
      - series: 'cmdctrl_bot_seat_owed_seconds_max{job="cmdctrl-server", env="prod", host="cmd-and-ctrl-b", instance="127.0.0.1:9464"}'
        values: "100x40"
    alert_rule_test:
      - eval_time: 2m
        alertname: BotSeatWedged
        exp_alerts: []
      - eval_time: 5m
        alertname: BotSeatWedged
        exp_alerts:
          - exp_labels:
              alertname: BotSeatWedged
              severity: critical
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: a bot seat on cmd-and-ctrl has been stuck for 3m 20s"
              description: "A bot seat on the prod server on cmd-and-ctrl has had a legal move for 3m 20s and played none, so its table is waiting. The Logs dashboard has the bot's WARN lines; GET /games/{id}/bot/stats shows its counters. Archiving the table frees the players."
      - eval_time: 12m
        alertname: BotSeatWedged
        exp_alerts:
          - exp_labels:
              alertname: BotSeatWedged
              severity: critical
              job: cmdctrl-server
              env: prod
              host: cmd-and-ctrl
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "prod: a bot seat on cmd-and-ctrl has been stuck for 3m 20s"
              description: "A bot seat on the prod server on cmd-and-ctrl has had a legal move for 3m 20s and played none, so its table is waiting. The Logs dashboard has the bot's WARN lines; GET /games/{id}/bot/stats shows its counters. Archiving the table frees the players."
          - exp_labels:
              alertname: BotSeatWedged
              severity: warning
              job: cmdctrl-server
              env: dev
              host: cmd-and-ctrl-dev
              instance: 127.0.0.1:9464
            exp_annotations:
              summary: "dev: a bot seat on cmd-and-ctrl-dev has been stuck for 3m 20s"
              description: "A bot seat on the dev server on cmd-and-ctrl-dev has had a legal move for 3m 20s and played none."

  # ------------------------------------------------------------ BotFallbackRising
  - name: BotFallbackRising, over 10% of a tier's moves are runner fallbacks, with at least 10 of them
    interval: 1m
    input_series:
      # strong: 3 fallbacks in 20 decisions a minute is 15%.
      - series: 'cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="strong", cause="timeout"}'
        values: "0+3x50"
      - series: 'cmdctrl_bot_decisions_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="strong", layer="C"}'
        values: "0+20x50"
      # The model funnel's own fallbacks are not this alert.
      - series: 'cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="assisted", cause="model-error"}'
        values: "0+50x50"
      - series: 'cmdctrl_bot_decisions_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="assisted", layer="B"}'
        values: "0+100x50"
      # heuristic: 1% fallbacks.
      - series: 'cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="heuristic", cause="policy-error"}'
        values: "0+1x50"
      - series: 'cmdctrl_bot_decisions_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="heuristic", layer="B"}'
        values: "0+100x50"
      # A near-idle tier where three of three moves fell back: under the floor of 10.
      - series: 'cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="random", cause="out-of-range"}'
        values: "0x10 3x40"
      - series: 'cmdctrl_bot_decisions_total{job="cmdctrl-server", env="prod", host="cmd-and-ctrl", instance="127.0.0.1:9464", tier="random", layer="random"}'
        values: "0x10 3x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: BotFallbackRising
        exp_alerts: []
      - eval_time: 30m
        alertname: BotFallbackRising
        exp_alerts:
          - exp_labels:
              alertname: BotFallbackRising
              severity: warning
              env: prod
              host: cmd-and-ctrl
              tier: strong
            exp_annotations:
              summary: "prod: 15% of strong bot moves on cmd-and-ctrl are fallbacks"
              description: "The runner replaced the policy's answer (timeout, policy-error or out-of-range) for 15% of strong bot decisions on cmd-and-ctrl (prod) over 15 minutes. cmdctrl_bot_fallbacks_total by cause says which; the Engine and bots dashboard has the model's latency. The 10% is a first guess."

  # ------------------------------------------------- OffsiteBackupStale, missing
  - name: OffsiteBackupStale (missing), no backup series at all for 2 hours on prod
    interval: 5m
    input_series:
      - series: 'up{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 1h
        alertname: OffsiteBackupStale
        exp_alerts: []
      - eval_time: 3h
        alertname: OffsiteBackupStale
        exp_alerts:
          - exp_labels:
              alertname: OffsiteBackupStale
              severity: warning
              cause: missing
              job: node
              env: prod
            exp_annotations:
              summary: "prod: no off-site backup has ever been reported"
              description: "The off-site backup's success timestamp has been missing from prod for 2 hours: the backup has never run there, or the node scrape does not carry its textfile. systemctl list-timers cmd-and-ctrl-backup.timer on the host says whether it is scheduled."

  - name: OffsiteBackupStale (missing), the series is there so it stays quiet
    interval: 5m
    input_series:
      - series: 'cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node", env="prod", host="cmd-and-ctrl"}'
        values: "0+300x60"
    alert_rule_test:
      - eval_time: 3h
        alertname: OffsiteBackupStale
        exp_alerts: []
