# Alert rules for cmd_and_ctrl (ADR 0123 §7). Runbook: docs/monitoring.md.
#
# The monitoring VM fetches deploy/monitoring/rules/*.yml from `main` every
# 10 minutes, checks it with `promtool check rules` and reloads Prometheus.
# tests/ is for CI only and is never synced. Every alert here has a unit test
# under tests/: add one with any new rule.
#
# Alertmanager routes everything to one Discord channel, grouped by alertname
# and env. So every rule carries `severity` (critical | warning) and a
# summary that names the env and, where there is one, the host.
#
# Dev deploys restart the server often, so a dev alert is never critical and
# waits longer where a restart could trip it.
#
# Jobs (deploy/alloy/config.alloy and the monitoring VM):
#   cmdctrl-server  the game server's own metrics, from each app host's Alloy
#   node            Alloy's node exporter: host, systemd units, textfiles
#   blackbox        the monitoring VM's probes of each site's /healthz
# Every app-host series has env (prod | dev) and host; the monitoring VM's
# own series have env="monitoring".

groups:
  - name: cmdctrl-availability
    rules:
      # The site as a player sees it: the blackbox probe goes out through
      # Cloudflare, so this also catches a dead tunnel or Caddy.
      - alert: SiteDown
        expr: probe_success{job="blackbox", env="prod"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: the site is down ({{ $labels.instance }})"
          description: "The blackbox probe of {{ $labels.instance }} has failed for 3 minutes. Players cannot reach {{ $labels.env }}."

      - alert: SiteDown
        expr: probe_success{job="blackbox", env="dev"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: the site is down ({{ $labels.instance }})"
          description: "The blackbox probe of {{ $labels.instance }} has failed for 10 minutes."

      # No samples from the server for 5 minutes. Two shapes: Alloy is alive
      # and scraping a dead server (up stays 0), or nothing arrives at all
      # (the host, Alloy or the push path is down, and `up` goes absent).
      # Dev is 5 minutes too: a deploy restart takes seconds, and the ADR's
      # exit check stops the dev server to see this fire.
      - alert: ServerNotReporting
        expr: >-
          max_over_time(up{job="cmdctrl-server", env="prod"}[5m]) == 0
          or absent_over_time(up{job="cmdctrl-server", env="prod"}[5m])
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: the game server has not reported for 5 minutes{{ with $labels.host }} on {{ . }}{{ end }}"
          description: "No metrics from the {{ $labels.env }} game server for 5 minutes. Either the server is down while Alloy still scrapes it (up is 0), or nothing reaches the monitor from that host at all."

      - alert: ServerNotReporting
        expr: >-
          max_over_time(up{job="cmdctrl-server", env="dev"}[5m]) == 0
          or absent_over_time(up{job="cmdctrl-server", env="dev"}[5m])
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: the game server has not reported for 5 minutes{{ with $labels.host }} on {{ . }}{{ end }}"
          description: "No metrics from the {{ $labels.env }} game server for 5 minutes. Either the server is down while Alloy still scrapes it (up is 0), or nothing reaches the monitor from that host at all."

      # A deploy restarts the server once. Four starts in 15 minutes is a
      # loop (#598 item 3: a month of one went unnoticed).
      - alert: ServerCrashLoop
        expr: changes(process_start_time_seconds{job="cmdctrl-server", env="prod"}[15m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: the game server on {{ $labels.host }} is crash-looping"
          description: "The {{ $labels.env }} server on {{ $labels.host }} started {{ $value }} more times in the last 15 minutes."

      - alert: ServerCrashLoop
        expr: changes(process_start_time_seconds{job="cmdctrl-server", env="dev"}[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: the game server on {{ $labels.host }} is crash-looping"
          description: "The {{ $labels.env }} server on {{ $labels.host }} started {{ $value }} more times in the last 15 minutes."

      # The server and bot units stop restarting after 10 starts in 600 s
      # and sit in `failed` (#598 item 2). The backup is a oneshot whose
      # failure OffsiteBackupStale already reports, so it is left out here.
      - alert: UnitFailed
        expr: >-
          node_systemd_unit_state{job="node", env="prod", name=~"cmd-and-ctrl.*",
          name!="cmd-and-ctrl-backup.service", state="failed"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: {{ $labels.name }} has failed on {{ $labels.host }}"
          description: "systemd gave up restarting {{ $labels.name }} on {{ $labels.host }} ({{ $labels.env }}). It will not start again by itself."

      - alert: UnitFailed
        expr: >-
          node_systemd_unit_state{job="node", env="dev", name=~"cmd-and-ctrl.*",
          name!="cmd-and-ctrl-backup.service", state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $labels.name }} has failed on {{ $labels.host }}"
          description: "systemd gave up restarting {{ $labels.name }} on {{ $labels.host }} ({{ $labels.env }}). It will not start again by itself."

  - name: cmdctrl-games
    rules:
      # The boot's restore pass could not bring a table back (ADR 0044).
      # The gauge is set once at boot and stays, so the alert only looks
      # within 15 minutes of a start and then resolves on its own.
      - alert: RestoreAbandonedGames
        expr: >-
          cmdctrl_boot_restore_games{job="cmdctrl-server", outcome="abandoned"} > 0
          and on (env, host, instance)
          (time() - process_start_time_seconds{job="cmdctrl-server"}) < 900
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: the last restart on {{ $labels.host }} abandoned {{ $value }} game(s)"
          description: "The {{ $labels.env }} server on {{ $labels.host }} could not restore {{ $value }} table(s) from their restore points at boot. Their players lost the game."

      # A deploy now would rewind a live table by more than 10 minutes. A
      # restart does not trip this, so dev shares the rule.
      - alert: RestorePointLagging
        expr: cmdctrl_restore_point_age_seconds{job="cmdctrl-server"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: restore points on {{ $labels.host }} are {{ $value | humanizeDuration }} behind"
          description: "The oldest restore point among active tables on {{ $labels.host }} ({{ $labels.env }}) is {{ $value | humanizeDuration }} old. A deploy or crash now would rewind that table that far."

  - name: cmdctrl-capacity
    rules:
      # The boot's restore pass left tables on disk because the load cap
      # was full (ADR 0148 section 7). To their players each reads "game
      # not found" until the operator brings them back
      # (POST /admin/capacity/restore-deferred, which also lowers this
      # gauge) or the next boot. The gauge persists, so unlike
      # RestoreAbandonedGames this one does not look at the process age:
      # it stays until the tables are back, and repeats every 4 h.
      - alert: RestoreDeferredGames
        expr: cmdctrl_boot_restore_deferred_games{job="cmdctrl-server"} > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $value }} table(s) on {{ $labels.host }} are waiting on disk, not restored"
          description: "{{ $value }} table(s) on {{ $labels.host }} ({{ $labels.env }}) were not restored at the last boot because the table-load cap was full. Their players see \"game not found\". Free load and POST /admin/capacity/restore-deferred, or restart with a raised cap."

      # ADR 0148: a cap this close to full is about to turn people away.
      # The ratio is per resource (table_load, ws_connections). A cap that
      # is off reports a limit of 0, which would divide to +Inf or NaN, so
      # the divisor keeps only the capped resources. The table_load cap is
      # soft (people sit at tables already admitted), so the ratio can pass
      # 1; the rule still fires, and that is when new tables are refused.
      # FIRST GUESS, not measured: 0.8 for 10 minutes is the figure #3103
      # suggested before any week of prod data existed. Tune it from the
      # Overview dashboard's Capacity row (ADR 0148, the 2026-10-13
      # amendment).
      - alert: CapacityHigh
        expr: >-
          cmdctrl_capacity_used{job="cmdctrl-server"}
          / (cmdctrl_capacity_limit{job="cmdctrl-server"} > 0)
          > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $labels.resource }} on {{ $labels.host }} is at {{ $value | humanizePercentage }} of its cap"
          description: "{{ $labels.resource }} on {{ $labels.host }} ({{ $labels.env }}) has been over 80% of its capacity cap for 10 minutes (now {{ $value | humanizePercentage }}). At 100% new tables, bot seats or newcomers are turned away. The 80% and 10 minutes are a first guess (ADR 0148), not a measured threshold."

  # What a player meets first once the site is public (#3350). Prod only:
  # a dev deploy, a tester and a half-built branch would trip all of these.
  # Every threshold is a FIRST GUESS, set before a week of prod traffic
  # existed; each rule also needs a floor of traffic, so one failed
  # request on a quiet night is not "100% errors". Tune them from the
  # Overview and Server dashboards.
  - name: cmdctrl-traffic
    rules:
      # The 5xx share of all requests (the WebSocket upgrade included).
      - alert: HighErrorRate
        expr: >-
          sum by (env, host) (rate(cmdctrl_http_requests_total{job="cmdctrl-server", env="prod", code="5xx"}[5m]))
          / sum by (env, host) (rate(cmdctrl_http_requests_total{job="cmdctrl-server", env="prod"}[5m]))
          > 0.05
          and sum by (env, host) (increase(cmdctrl_http_requests_total{job="cmdctrl-server", env="prod"}[5m])) > 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: {{ $value | humanizePercentage }} of requests on {{ $labels.host }} are failing (5xx)"
          description: "More than 5% of HTTP requests to the {{ $labels.env }} server on {{ $labels.host }} have been answered 5xx for 5 minutes (now {{ $value | humanizePercentage }}). The 5% is a first guess."

      # Per route, so the message says which one is slow. The WebSocket is
      # not timed (its duration is a session). A route needs about one
      # request every 20 s, or a single slow call is its own p95.
      - alert: HighLatency
        expr: >-
          histogram_quantile(0.95, sum by (le, env, host, route) (rate(cmdctrl_http_request_seconds_bucket{job="cmdctrl-server", env="prod"}[5m])))
          > 2
          and on (env, host, route)
          sum by (env, host, route) (rate(cmdctrl_http_request_seconds_count{job="cmdctrl-server", env="prod"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $labels.route }} on {{ $labels.host }} is slow (p95 {{ $value | humanizeDuration }})"
          description: "The 95th-percentile time to serve {{ $labels.route }} on {{ $labels.host }} ({{ $labels.env }}) has been over 2 seconds for 10 minutes (now {{ $value | humanizeDuration }}). The 2 s is a first guess."

      # A limiter turning people away. The code label is only a class
      # (4xx), so the server counts 429s on their own.
      - alert: RateLimitSpike
        expr: sum by (env, host) (increase(cmdctrl_http_rate_limited_total{job="cmdctrl-server", env="prod"}[5m])) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $value | humanize }} requests on {{ $labels.host }} were rate limited (429) in 5 minutes"
          description: "The {{ $labels.env }} server on {{ $labels.host }} answered over 100 requests 429 in 5 minutes, for 5 minutes running. Either one client is hammering a route, or a limiter is too tight for real players. cmdctrl_http_rate_limited_total by route says which. The 100 is a first guess."

      # Discord sign-in failing on our side or Discord's. The role gate
      # fails closed with a redirect, which no HTTP metric shows, so these
      # are counted on their own. Someone who lacks the role is not here.
      - alert: AuthFailures
        expr: increase(cmdctrl_auth_failures_total{job="cmdctrl-server", env="prod"}[10m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: Discord sign-in is failing on {{ $labels.host }} ({{ $labels.reason }})"
          description: "{{ $value | humanize }} sign-ins failed with reason {{ $labels.reason }} on {{ $labels.host }} ({{ $labels.env }}) in the last 10 minutes. oauth_exchange and oauth_profile: Discord or the client secret. gate_check: Discord did not answer the role check, so sign-in fails closed. signin_record: the database. The 3-in-10-minutes is a first guess."

  - name: cmdctrl-bots
    rules:
      # The spend guard counts WEIGHTED tokens (micro-dollars at list price, so
      # a cap of 5,000,000 is about five dollars; ADR 0184), not invoiced money. The
      # caps are CMDCTRL_BOT_MODEL_DAILY_TOKENS and _MONTHLY_TOKENS; a cap
      # that is off reports a limit of 0 and is ignored.
      - alert: BotModelSpendHigh
        expr: >-
          cmdctrl_bot_budget_tokens{job="cmdctrl-server", env="prod"}
          / (cmdctrl_bot_budget_limit_tokens{job="cmdctrl-server", env="prod"} > 0)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: hosted-model spend is at {{ $value | humanizePercentage }} of the {{ $labels.period }} cap"
          description: "The {{ $labels.env }} bots have used {{ $value | humanizePercentage }} of this {{ $labels.period }}'s weighted-token cap (micro-dollars at list price). At 100% the model tiers stop and the bots play the heuristic. The 80% is a first guess."

      # Model calls refused: a cap was reached, or the admin kill switch is
      # off (PUT /admin/bot/model). The switch is deliberate, but left off
      # it silently downgrades every model bot.
      - alert: BotModelBlocked
        expr: cmdctrl_bot_budget_blocked{job="cmdctrl-server", env="prod"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: hosted-model calls have been refused for 15 minutes"
          description: "The {{ $labels.env }} spend guard is refusing model calls: a daily or monthly weighted-token cap is reached, or the kill switch is off. (One table reaching its own share does not set this.) Model-backed bots play the heuristic meanwhile. GET /admin/bot/model says which."

      # A bot seat that has a legal move and has played none. The table
      # waits on it (#544). 2 minutes is past the slowest think deadline
      # (120 s with thinking on is the ceiling).
      - alert: BotSeatWedged
        expr: cmdctrl_bot_seat_owed_seconds_max{job="cmdctrl-server", env="prod"} > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.env }}: a bot seat on {{ $labels.host }} has been stuck for {{ $value | humanizeDuration }}"
          description: "A bot seat on the {{ $labels.env }} server on {{ $labels.host }} has had a legal move for {{ $value | humanizeDuration }} and played none, so its table is waiting. The Logs dashboard has the bot's WARN lines; GET /games/{id}/bot/stats shows its counters. Archiving the table frees the players."

      - alert: BotSeatWedged
        expr: cmdctrl_bot_seat_owed_seconds_max{job="cmdctrl-server", env="dev"} > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: a bot seat on {{ $labels.host }} has been stuck for {{ $value | humanizeDuration }}"
          description: "A bot seat on the {{ $labels.env }} server on {{ $labels.host }} has had a legal move for {{ $value | humanizeDuration }} and played none."

      # Windows where the runner replaced the policy's answer: it timed
      # out, errored or answered out of range. The model funnel's own
      # fallbacks (model-*) are a dashboard panel. Floor of 10 so a
      # quiet hour's one timeout is not 100%.
      - alert: BotFallbackRising
        expr: >-
          sum by (env, host, tier) (increase(cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", cause=~"timeout|policy-error|out-of-range"}[15m]))
          / sum by (env, host, tier) (increase(cmdctrl_bot_decisions_total{job="cmdctrl-server", env="prod"}[15m]))
          > 0.1
          and sum by (env, host, tier) (increase(cmdctrl_bot_fallbacks_total{job="cmdctrl-server", env="prod", cause=~"timeout|policy-error|out-of-range"}[15m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $value | humanizePercentage }} of {{ $labels.tier }} bot moves on {{ $labels.host }} are fallbacks"
          description: "The runner replaced the policy's answer (timeout, policy-error or out-of-range) for {{ $value | humanizePercentage }} of {{ $labels.tier }} bot decisions on {{ $labels.host }} ({{ $labels.env }}) over 15 minutes. cmdctrl_bot_fallbacks_total by cause says which; the Engine and bots dashboard has the model's latency. The 10% is a first guess."

  - name: cmdctrl-moderation
    rules:
      # ADR 0075 section 2.6 (#3113): a "report player" lands in the admin
      # Reports tab and tells nobody. The counter goes up once per stored
      # report, with no label, so this names no player, table or reason:
      # the message says to open the tab. 15 minutes is a first guess at
      # a window that survives a scrape gap yet resolves before the next
      # repeat. Prod only: a report filed on dev is somebody testing.
      - alert: PlayerReportFiled
        expr: increase(cmdctrl_player_reports_total{job="cmdctrl-server", env="prod"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: a player report was filed"
          description: "{{ $labels.env }} stored a new player report in the last 15 minutes. Open the Reports tab in the admin views to read it (ADR 0075 section 2.6). The window is a first guess; the alert says only that a report exists, never who or why."

  - name: cmdctrl-hosts
    rules:
      # scripts/backup-offsite.sh writes these to the textfile directory at
      # the end of every run (docs/environments.md#backups).
      # Two rules, told apart by `cause`: too long since the last success,
      # or the last run failed.
      - alert: OffsiteBackupStale
        expr: time() - cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node"} > 36 * 3600
        labels:
          severity: warning
          cause: stale
        annotations:
          summary: "{{ $labels.env }}: no off-site backup from {{ $labels.host }} for {{ $value | humanizeDuration }}"
          description: "The nightly off-site backup on {{ $labels.host }} ({{ $labels.env }}) last succeeded {{ $value | humanizeDuration }} ago."

      - alert: OffsiteBackupStale
        expr: cmdctrl_offsite_backup_last_exit_code{job="node"} != 0
        labels:
          severity: warning
          cause: failed
        annotations:
          summary: "{{ $labels.env }}: the last off-site backup on {{ $labels.host }} failed (exit {{ $value }})"
          description: "scripts/backup-offsite.sh on {{ $labels.host }} ({{ $labels.env }}) exited {{ $value }} on its last run. journalctl -u cmd-and-ctrl-backup says why."

      # A comparison on a series that does not exist never fires: a host
      # whose textfile was never written, or that stopped writing it
      # (the series ages out of the scrape), would be silent. Prod only: a
      # dev host may not run the backup at all.
      - alert: OffsiteBackupStale
        expr: absent(cmdctrl_offsite_backup_last_success_timestamp_seconds{job="node", env="prod"})
        for: 2h
        labels:
          severity: warning
          cause: missing
        annotations:
          summary: "{{ $labels.env }}: no off-site backup has ever been reported"
          description: "The off-site backup's success timestamp has been missing from {{ $labels.env }} for 2 hours: the backup has never run there, or the node scrape does not carry its textfile. systemctl list-timers cmd-and-ctrl-backup.timer on the host says whether it is scheduled."

      # scripts/restore-rehearsal.sh (monthly timer) restores the latest
      # snapshot into a scratch dir, opens and migrates the database and
      # re-applies the deletion ledger (#3340). Two rules, told apart by
      # `cause`: no passing rehearsal for 35 days (a monthly timer plus
      # five days' slack), or the last one failed.
      - alert: RestoreRehearsalStale
        expr: time() - cmdctrl_restore_rehearsal_last_success_timestamp_seconds{job="node"} > 35 * 86400
        labels:
          severity: warning
          cause: stale
        annotations:
          summary: "{{ $labels.env }}: no restore rehearsal on {{ $labels.host }} for {{ $value | humanizeDuration }}"
          description: "The monthly restore rehearsal on {{ $labels.host }} ({{ $labels.env }}) last passed {{ $value | humanizeDuration }} ago. An untested backup is not a backup: docs/environments.md#restore-rehearsal."

      - alert: RestoreRehearsalStale
        expr: cmdctrl_restore_rehearsal_last_exit_code{job="node"} != 0
        labels:
          severity: warning
          cause: failed
        annotations:
          summary: "{{ $labels.env }}: the last restore rehearsal on {{ $labels.host }} failed (exit {{ $value }})"
          description: "scripts/restore-rehearsal.sh on {{ $labels.host }} ({{ $labels.env }}) exited {{ $value }}. journalctl -u cmd-and-ctrl-restore-rehearsal says why; the latest backup may not restore."

      # Every real filesystem on every host, the monitoring VM's included.
      - alert: DiskFilling
        expr: >-
          node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|nsfs|fuse.*"}
          / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|overlay|squashfs|ramfs|devtmpfs|nsfs|fuse.*"}
          < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: {{ $labels.mountpoint }} on {{ $labels.host }} is {{ $value | humanizePercentage }} free"
          description: "{{ $labels.mountpoint }} ({{ $labels.device }}) on {{ $labels.host }} ({{ $labels.env }}) has had under 15% free for 15 minutes."

      # The monitoring VM's config sync (HomeLab) writes these when it runs.
      # A sync that keeps failing leaves the last good rules and dashboards
      # in place, so nothing else would show it.
      - alert: MonitoringConfigSyncFailing
        expr: time() - cmdctrl_monitoring_sync_last_success_timestamp_seconds{env="monitoring"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.env }}: the monitoring config sync on {{ $labels.host }} has not succeeded for {{ $value | humanizeDuration }}"
          description: "The monitoring VM ({{ $labels.host }}) has not applied deploy/monitoring/ from main for {{ $value | humanizeDuration }}. Its rules and dashboards are the last good copy."
