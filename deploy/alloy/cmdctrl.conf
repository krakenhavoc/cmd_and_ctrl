# Drop-in for the Alloy package's alloy.service (ADR 0123 §10).
#
# Installed as /etc/systemd/system/alloy.service.d/cmdctrl.conf by the CD
# step "Ensure monitoring agent" in .github/workflows/ci-cd.yml, on both
# hosts. The package's own unit and /etc/default/alloy are left as shipped.

[Service]
# Written by CD on every deploy, root:alloy 0640: the monitoring URL, this
# host's push password, the env label, and CUSTOM_ARGS (which pins Alloy's
# UI to 127.0.0.1:12345 and turns off usage reporting). Listed after the
# package's EnvironmentFile=/etc/default/alloy, so its CUSTOM_ARGS wins.
EnvironmentFile=/etc/alloy/env
# loki.source.journal reads the system journal. The package's postinst
# adds alloy to this group already; saying it here keeps it true on a host
# where that did not happen.
SupplementaryGroups=systemd-journal
