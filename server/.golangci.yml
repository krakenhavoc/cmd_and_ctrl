# golangci-lint config for cmd_and_ctrl server, in the v2 format
# (golangci-lint v2.14.0; converted by `golangci-lint migrate`, ADR 0122 §1.1).
# Deliberately conservative: start with stable, low-noise linters and add
# more only when they catch real bugs. See https://golangci-lint.run/.
#
# Notably NOT enabled:
#   - govet/fieldalignment — noisy on structs containing sync primitives
#     where the author usually has a deliberate layout. The one struct
#     whose padding matters, game.Card, is guarded by
#     TestCardHasNoInteriorPadding (internal/game/card_layout_test.go)
#     instead (#35), which also recurses into struct-valued fields
#     Card embeds by value, such as AttachedTo and Provenance (#633).
#   - shadow — too many false positives on common idioms.
version: "2"

run:
  # 6m: the old 3m budget measured 3m11s on the self-hosted runner with zero headroom (#1245).
  # `migrate` drops this key (v2 has no timeout by default); it is kept on purpose.
  timeout: 6m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      # v2 folded gosimple (S), stylecheck (ST) and the quickfix (QF)
      # checks into staticcheck. This is staticcheck's own v2 default set
      # (all classes minus the six noisy ST checks) minus QF1001 (#2254;
      # counts measured on the tree at the time):
      #   on:  SA (as before), S (10), QF1002/1008/1011/1012 (17),
      #        ST1005/1018 (9)
      #   off: QF1001 (72) De Morgan rewrites. Mechanical but they trade a
      #        readable "!(a && b)" for an equivalent that reads worse in
      #        most of the hits; not worth the churn or the review load.
      #   off: ST1000 (package comments), ST1003 (initialisms and naming:
      #        renames touch wire/exported names), ST1016 (receiver names),
      #        ST1020/1021/1022 (doc comment must start with the name) are
      #        staticcheck's own non-defaults; they are style, not bugs.
      checks:
        - all
        - -QF1001
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    misspell:
      # "Compleat" and its family are Phyrexian spellings printed on real
      # cards (Staff of Compleation, Elesh Norn, Mother of Machines). The
      # card name is data, not prose, so misspell must not "correct" it.
      ignore-rules:
        - compleation
        - compleat
        - compleated
        # Theorix Metamage (Reality Fracture) is a printed card name.
        - metamage
        # Captain Mar-Vell, Space-Born (Marvel Super Heroes) is a printed card name.
        - vell
  exclusions:
    # v1's defaults, written out by `migrate`: lax generated-file
    # detection and the three conventional directories. No preset is
    # enabled, which is v1's `exclude-use-default: false`.
    generated: lax
    rules:
      # Test code drops Close/Write errors on purpose and keeps helpers
      # whose spare parameter documents intent. errcheck and unparam earn
      # their keep in production code; in tests they are noise (#582).
      - linters:
          - errcheck
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
